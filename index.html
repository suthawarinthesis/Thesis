<style>

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field.full{grid-column:1/-1}.field label{display:block;font-size:10px;font-weight:900;color:#667169;margin:0 0 5px}.hint{font-size:10px;color:#929a94;margin-top:4px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.modal-bg{display:none;position:fixed;inset:0;background:rgba(25,32,28,.22);backdrop-filter:blur(3px);z-index:90}.modal-bg.show{display:block}.modal{display:none;position:fixed;z-index:100;top:50%;left:50%;transform:translate(-50%,-50%);width:min(860px,calc(100vw - 26px));max-height:90vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:21px;box-shadow:0 30px 100px rgba(27,35,30,.2)}.modal.show{display:block}.modal-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:15px}.modal-head h2{margin:4px 0 0;font-size:21px}.close{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:#fff}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.step{padding:12px 8px;border:1px solid var(--line);border-radius:13px;text-align:center;font-size:10px;font-weight:800;color:#78817b;background:#fafbfa}.step.done{background:#edf3ef;color:#4c6e5d;border-color:#dce8df}.step.active{background:#eef3f6;color:#557485;border-color:#dbe6ec}.file-row{display:grid;grid-template-columns:1.3fr .7fr .55fr .6fr auto;gap:8px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;margin-top:8px;background:#fbfcfb}.file-row b{font-size:11px}.file-row span{font-size:10px;color:#7c867f}.file-drop{border:1.5px dashed #cbd4cd;border-radius:16px;padding:20px;text-align:center;background:#fafcfb;color:#7b857e}.file-drop.drag{background:#f0f5f1;border-color:#879d90}
.map-shell{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px}.map-canvas{min-height:640px;border:1px solid var(--line);border-radius:18px;background:#fff;display:grid;place-items:center;overflow:auto}.map-canvas svg{max-width:100%;height:auto}.legend{display:grid;gap:8px}.legend-item{display:flex;gap:8px;align-items:center;font-size:10px}.sw{width:12px;height:12px;border-radius:3px}.tooltip{position:fixed;pointer-events:none;z-index:200;background:#202521;color:white;padding:8px 10px;border-radius:10px;font-size:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;max-width:250px}
.chart{border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;overflow:auto}.chart svg{width:100%;height:auto;min-width:700px}.hotspot-list{display:grid;gap:7px}.hotspot{padding:10px;border:1px solid var(--line);border-radius:12px;background:#fafbfa;display:flex;justify-content:space-between;gap:10px}.hotspot b{font-size:11px}.hotspot span{font-size:10px;color:#7c857f}.preset{padding:15px;border:1px solid var(--line);border-radius:16px;background:#fbfcfb;margin-bottom:9px}.preset-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.preset h3{margin:0;font-size:14px}.preset p{font-size:11px;color:#737d76;line-height:1.6;margin:8px 0}.method-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.method{padding:10px;border-radius:12px;background:#fff;border:1px solid #eaede9}.method b{display:block;font-size:10px}.method span{font-size:9px;color:#818a84}.source-note{padding:13px;border-left:4px solid #bac7bf;background:#f7f9f7;border-radius:0 13px 13px 0;color:#68736b;font-size:11px;line-height:1.65}.source-note b{color:#3b4740}
.ir-rows{display:grid;gap:12px}.ir-row{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center}.ir-name{font-size:11px;font-weight:850}.ir-bar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line);position:relative}.seg{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:850;color:#36433c;min-width:28px}.seg.lsc{background:#eaf1ed}.seg.irb,.seg.ira{background:#f3e7cf}.seg.ssc{background:#e8f0f4}.ir-labels{display:grid;grid-template-columns:repeat(4,1fr);font-size:9px;color:#7c867f;margin-top:4px}.tree-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;min-height:450px}.tree-wrap svg{min-width:850px}.codon-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.notice{padding:12px 14px;border-radius:13px;background:#f5f7f5;border:1px solid var(--line);font-size:11px;color:#657068;line-height:1.6}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;z-index:250;background:#202521;color:white;border-radius:12px;padding:9px 13px;font-size:11px;font-weight:800;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.metric{grid-column:span 6}.split,.map-shell,.codon-grid{grid-template-columns:1fr}.method-grid{grid-template-columns:1fr 1fr}.map-shell .map-canvas{min-height:520px}}@media(max-width:700px){.top-inner{padding:11px 13px}.brand small{display:none}.brand{min-width:0}.top-actions .hide-mobile{display:none}.nav{top:65px}.nav-inner,main{padding-left:13px;padding-right:13px}.hero{padding:23px}.hero h1{font-size:39px}.metric{grid-column:1/-1}.page-head{align-items:flex-start;flex-direction:column}.form-grid,.mini-grid,.method-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.track{grid-template-columns:repeat(2,1fr)}.file-row{grid-template-columns:1fr}.ir-row{grid-template-columns:1fr}.map-canvas{min-height:420px}}
</style>
</head>
<body>
<div class="top"><div class="top-inner"><div class="brand"><div class="mark">cp</div><div><b>cpGenome Workbench</b><small>Plant specimen → sequencing → plastome analysis</small></div></div><div class="top-actions"><button class="btn ghost hide-mobile" id="backupBtn">⇩ Backup</button><button class="btn ghost hide-mobile" id="restoreBtn">⇧ Restore</button><button class="btn primary" id="quickBtn">＋ เพิ่มข้อมูล</button><input id="restoreFile" class="hidden" type="file" accept="application/json"></div></div></div>
<div class="nav"><div class="nav-inner" id="nav"></div></div>
<main id="main"></main>
<div class="modal-bg" id="modalBg"></div><div class="modal" id="modal"><div class="modal-head"><div><div class="ey" id="modalEy">DATA ENTRY</div><h2 id="modalTitle">เพิ่มข้อมูล</h2></div><button class="close" id="closeModal">×</button></div><form id="modalForm"><div class="form-grid" id="modalFields"></div><div class="form-actions"><button type="button" class="btn ghost" id="cancelModal">ยกเลิก</button><button class="btn primary" type="submit">บันทึก</button></div></form></div>
<div class="tooltip" id="tip"></div><div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const STORE='cpGenomeWorkbench.v2';
const DB='cpGenomeWorkbench.files.v1', DBSTORE='files';
const views=[
 ['dashboard','⌂','ภาพรวม'],['specimens','♧','ตัวอย่าง & Sequencing'],['genomes','◉','cp Genome'],['map','◎','Circular Map'],['compare','⇄','Compare & Hotspot'],['repeats','≋','Repeats'],['ir','▤','IR Borders'],['phylogeny','⑂','Phylogeny'],['codon','◫','Codon Bias'],['methods','▥','Paper Methods'],['settings','⚙','ตั้งค่า']
];
const paperPresets={
 solanum:{name:'Solanum lasiocarpum · Scientific Reports 2026',short:'Solanum 2026',platform:'Illumina NovaSeq 6000',library:'350-bp paired-end library · 150-bp PE reads',assembly:'NOVOwrap v1.20',seed:'rbcL · Solanum candidum MH588527',annotation:'GeSeq v2.03 · manual check',map:'OGDRAW v1.3.1',ir:'CPJSdraw v1.0.0 / Geneious border verification',compare:'mVISTA · Shuffle-LAGAN',align:'MAFFT v7',distance:'MEGA7 · K2P · 1,000 bootstrap',ssr:'MISA: 10/6/5/5/5/5',large:'REPuter: min 30 bp · Hamming 3 · F/P/R/C',pi:'DnaSP · window 1000 bp · step 200 bp',phylo:'Complete plastome excluding IRa + 79 unique CDS',note:'Intraspecific comparison, variable sites, pairwise distance, nucleotide-diversity hotspots and two phylogenomic datasets.'},
 ipomoea:{name:'Ipomoea alba / I. obscura · Scientific Reports 2024',short:'Ipomoea 2024',platform:'Illumina NovaSeq X',library:'350-bp paired-end library · 150-bp PE reads',assembly:'NOVOPlasty v4.3.5',seed:'rbcL · Ipomoea batatas MW122507',annotation:'GeSeq v2.03 · BLAT + Chloë · manual boundary improvement',map:'OGDRAW v1.3.1',ir:'CPJSdraw v1.0',compare:'mVISTA · Shuffle-LAGAN',align:'MAFFT v7',distance:'MEGA-X / sequence divergence',ssr:'MISA: 10/4/4/3/3/3',large:'REPuter: min 30 bp · Hamming 3 · F/P/R/C',tandem:'Tandem Repeat Finder v4.09',pi:'DnaSP v5.10.01 · window 1000 bp · step 500 bp',codon:'RSCU → PR2 + neutrality plot',phylo:'Complete cp genome excluding IRa + 76 shared unique CDS · IQ-TREE',note:'Adds codon-usage bias (PR2/neutrality), IR-border comparison across taxa, divergence hotspots and phylogenomics.'},
 barleria:{name:'Barleria spp. · Genes 2022',short:'Barleria 2022',platform:'Illumina NovaSeq',library:'350-bp paired-end library · 150-bp PE reads · ~6 Gb raw data',assembly:'NOVOPlasty v2.7.2',seed:'rbcL · Barleria prionitis NC_048478',annotation:'GeSeq · manual check',map:'OGDRAW v1.3.1',ir:'IRscope',compare:'mVISTA · Shuffle-LAGAN',align:'MAFFT v7',distance:'MEGA-X · K2P · complete deletion · γ distribution',ssr:'MISA: 10/4/4/3/3/3',large:'REPuter: min 30 bp · Hamming 3',tandem:'TRF v4.09 · 2/2/7 · min score 80 · max period 500',pi:'DnaSP v5.10.01 · window 1000 bp · step 500 bp',phylo:'Complete cp genome + concatenated CDS + divergent regions · ML + BI',note:'Designed for species authentication: gene content, repeats, IR borders, mVISTA, genetic distance, divergence regions and phylogenetic discrimination.'},
 cratoxylum:{name:'Cratoxylum spp. · Scientific Reports 2022',short:'Cratoxylum 2022',platform:'Illumina NovaSeq',library:'paired-end NGS',assembly:'NOVOPlasty v2.7.2',seed:'rbcL · Cratoxylum cochinchinense MN399961',annotation:'GeSeq v2.03 · manual check',map:'OGDRAW v1.3.1',ir:'IRscope',compare:'mVISTA · Shuffle-LAGAN',align:'MAFFT v7',distance:'Pairwise distance + DnaSP site statistics',ssr:'MISA: 10/4/4/3/3/3',large:'REPuter: min 30 bp · Hamming 3 · F/P/R/C',pi:'DnaSP v5.10.01 · polymorphic/parsimony/indel sites',phylo:'Concatenated plastid CDS + nuclear ITS · ML + BI',note:'Includes structural-rearrangement tracking (large LSC inversion) and parallel plastid-CDS versus nuclear-ITS phylogenetic evidence.'}
};
const defaults={version:2,active:'dashboard',settings:{lang:'th',preset:'solanum',window:1000,step:200,cutoff:0.0015},specimens:[],sequencing:[],genomes:[],files:[],irBorders:[],trees:[],codonRows:[],activities:[]};
let state=load(), modalType='', editingId='', selectedGenome='';
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');return x&&x.version?Object.assign(structuredClone(defaults),x):structuredClone(defaults)}catch{return structuredClone(defaults)}}
function save(){localStorage.setItem(STORE,JSON.stringify(state));renderNav();}
function uid(p='R'){return p+'-'+Date.now().toString(36).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function esc(s=''){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function fmt(n){return Number(n||0).toLocaleString('en-US')}
function dateFmt(s){if(!s)return '—';try{return new Date(s).toLocaleDateString('th-TH')}catch{return s}}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function activity(action,detail){state.activities.unshift({id:uid('LOG'),at:new Date().toISOString(),action,detail});state.activities=state.activities.slice(0,100);save()}
function renderNav(){document.getElementById('nav').innerHTML=views.map(v=>`<button class="nav-btn ${state.active===v[0]?'active':''}" data-v="${v[0]}">${v[1]} ${v[2]}</button>`).join('');document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>setView(b.dataset.v))}
function setView(v){state.active=v;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function pill(s){const x=String(s||'');let c='';if(/complete|pass|received|annotated|done/i.test(x))c='ok';else if(/pending|sent|progress|assembly|qc/i.test(x))c='wait';else if(/review|partial/i.test(x))c='info';return `<span class="pill ${c}">${esc(x||'—')}</span>`}
function empty(icon,title,sub){return `<div class="empty"><div style="font-size:28px">${icon}</div><b>${title}</b><small>${sub}</small></div>`}
function download(name,text,type='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function table(rows,cols,type){if(!rows.length)return empty('⌁','ยังไม่มีข้อมูล','เพิ่มรายการแรกเพื่อเริ่ม workflow');return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>จัดการ</th></tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[2]?c[2](r[c[0]],r):esc(r[c[0]]||'—')}</td>`).join('')}<td><div class="actions"><button class="btn tiny ghost" onclick="app.edit('${type}','${r.id}')">แก้ไข</button><button class="btn tiny danger" onclick="app.del('${type}','${r.id}')">ลบ</button></div></td></tr>`).join('')}</tbody></table></div>`}
function render(){const main=document.getElementById('main');const fn={dashboard:dashboardView,specimens:specimenView,genomes:genomeView,map:mapView,compare:compareView,repeats:repeatView,ir:irView,phylogeny:treeView,codon:codonView,methods:methodsView,settings:settingsView}[state.active]||dashboardView;main.innerHTML=`<section class="view active">${fn()}</section>`;wireView();}
function counts(){return {samples:state.specimens.length,seq:state.sequencing.length,genomes:state.genomes.length,files:state.files.length,done:state.genomes.filter(x=>x.status==='Complete').length}}
function dashboardView(){const c=counts(),p=paperPresets[state.settings.preset];const workflow=['Specimen','DNA / Send','Raw Reads','Assembly','Annotation','Comparative','Phylogeny'];return `<div class="grid g12"><section class="card hero"><div class="ey">cp GENOME ONLY · NO LOGIN · NO GC–MS · NO LAB MODULE</div><h1>Chloroplast genome workflow ที่เริ่มจากตัวอย่างจริง และจบที่ figure พร้อมใช้ในเปเปอร์</h1><p>ระบบนี้ตัด GC–MS, ระบบห้องปฏิบัติการ และระบบงานวิจัยทั่วไปออก เหลือเฉพาะงาน chloroplast/plastid genome: specimen & voucher, sequencing tracking, assembly/annotation, circular map, LSC–SSC–IRa–IRb, clockwise/counterclockwise genes, repeats, IR-border comparison, nucleotide-diversity hotspot, phylogeny และ codon bias แบบที่พบในเปเปอร์ที่คุณส่งมา</p><div class="hero-actions"><button class="btn primary" onclick="app.open('specimen')">＋ บันทึกตัวอย่าง</button><button class="btn ghost" onclick="app.open('sequencing')">≋ บันทึก Sequencing</button><button class="btn ghost" onclick="app.open('genome')">◉ เพิ่ม cp Genome</button><button class="btn soft" onclick="app.setView('methods')">▥ Paper Methods</button></div><div class="chips"><span class="chip"><b>${esc(p.short)}</b>active preset</span><span class="chip"><b>${fmt(c.samples)}</b>specimens</span><span class="chip"><b>${fmt(c.seq)}</b>sequencing jobs</span><span class="chip"><b>${fmt(c.genomes)}</b>plastomes</span><span class="chip"><b>${fmt(c.files)}</b>tracked files</span></div></section>
${[['♧','ตัวอย่างพืช',c.samples],['≋','Sequencing jobs',c.seq],['◉','cp Genomes',c.genomes],['✓','Complete',c.done]].map(x=>`<section class="card metric"><div class="ico">${x[0]}</div><div class="num">${fmt(x[2])}</div><div class="lab">${x[1]}</div></section>`).join('')}
<section class="card" style="grid-column:span 8"><div class="panel-title"><div><div class="ey">PIPELINE READINESS</div><h2>ตัวอย่าง → sequence → complete plastome</h2></div></div><div class="track">${workflow.map((x,i)=>`<div class="step ${i<(c.genomes?5:Math.min(3,c.seq+1))?'done':i===Math.min(6,c.seq+1)?'active':''}">${i+1}<br>${x}</div>`).join('')}</div><div class="source-note" style="margin-top:14px"><b>ออกแบบให้ตรงกับงานที่ส่งมา:</b> ใช้ quadripartite structure, OGDRAW-style circular map, repeat analysis, IR boundary, mVISTA/MAFFT comparison, DnaSP hotspot และ phylogenomic datasets เป็นแกนกลาง แทนการมีโมดูลที่ไม่เกี่ยวกับ cp genome</div></section>
<section class="card" style="grid-column:span 4"><div class="panel-title"><div><div class="ey">ACTIVE PAPER PRESET</div><h2>${esc(p.short)}</h2></div></div><div class="mini-grid"><div class="mini"><b>${fmt(state.settings.window)}</b><span>Pi window (bp)</span></div><div class="mini"><b>${fmt(state.settings.step)}</b><span>step (bp)</span></div><div class="mini"><b>${esc(p.ssr.split(':')[1]||'')}</b><span>SSR preset</span></div><div class="mini"><b>30</b><span>REPuter min bp</span></div></div><p class="muted" style="margin-top:12px">${esc(p.note)}</p></section>
<section class="card" style="grid-column:1/-1"><div class="panel-title"><div><div class="ey">RECENT ACTIVITY</div><h2>cpGenome trail</h2></div></div>${state.activities.length?state.activities.slice(0,8).map(a=>`<div class="hotspot"><div><b>${esc(a.action)}</b><span>${esc(a.detail)}</span></div><span>${new Date(a.at).toLocaleString('th-TH')}</span></div>`).join(''):empty('↺','ยังไม่มีกิจกรรม','เมื่อเพิ่ม/แก้ไขข้อมูล รายการจะปรากฏที่นี่')}</section></div>`}
function specimenView(){const scols=[['sampleId','Sample ID'],['scientificName','Scientific name',(v)=>`<div class="row-title"><i>${esc(v)}</i></div>`],['voucher','Voucher'],['origin','Origin'],['collectionDate','Collected',dateFmt],['status','Status',pill]],qcols=[['jobId','Seq ID'],['sampleId','Sample'],['scientificName','Species'],['provider','Provider'],['platform','Platform'],['sentDate','Sent',dateFmt],['receivedDate','Received',dateFmt],['status','Status',pill]];return `<div class="page-head"><div><div class="ey">SPECIMEN → SEQUENCING</div><h1>♧ ตัวอย่างพืชและการส่ง Sequence</h1><p>เก็บตัวอย่าง, voucher, แหล่งเก็บ, การเตรียม DNA, ศูนย์ sequencing และติดตามว่าได้รับไฟล์อะไรกลับมาแล้วบ้าง</p></div><div class="actions"><button class="btn primary" onclick="app.open('specimen')">＋ ตัวอย่าง</button><button class="btn ghost" onclick="app.open('sequencing')">＋ Sequencing job</button></div></div><div class="split"><div class="card"><div class="panel-title"><div><div class="ey">PLANT MATERIAL</div><h2>Specimen registry</h2></div></div>${table(state.specimens,scols,'specimen')}</div><div class="card"><div class="panel-title"><div><div class="ey">SEQUENCING TRACKER</div><h2>Sent / received</h2></div></div>${table(state.sequencing,qcols,'sequencing')}</div></div><div class="card" style="margin-top:14px"><div class="panel-title"><div><div class="ey">SEQUENCE FILE VAULT</div><h2>ไฟล์ที่ได้รับจาก sequencing / bioinformatics</h2></div><button class="btn ghost" onclick="document.getElementById('vaultInput').click()">⇧ เพิ่มไฟล์</button></div><input class="hidden" id="vaultInput" type="file" multiple><div class="notice">FASTQ ขนาดใหญ่มากจะเก็บเฉพาะ metadata ใน browser; FASTA / GenBank / GFF / Newick / CSV / alignment ขนาดเล็กสามารถเก็บเนื้อหาไว้ใน IndexedDB เพื่อเปิดวิเคราะห์ต่อได้</div>${fileListHtml()}</div>`}
function fileListHtml(){if(!state.files.length)return empty('▧','ยังไม่มีไฟล์','เพิ่ม raw reads, FASTA, GenBank, GFF, alignment, Newick หรือผลวิเคราะห์');return state.files.map(f=>`<div class="file-row"><div><b>${esc(f.name)}</b><span>${esc(f.sampleId||f.genomeId||'unlinked')}</span></div><span>${esc(f.kind||'File')}</span><span>${formatBytes(f.size)}</span><span>${f.stored?'<span class="pill ok">stored</span>':'<span class="pill wait">metadata</span>'}</span><div class="actions">${f.stored?`<button class="btn tiny ghost" onclick="app.loadVault('${f.id}')">เปิด</button>`:''}<button class="btn tiny danger" onclick="app.removeFile('${f.id}')">ลบ</button></div></div>`).join('')}
function genomeView(){const cols=[['scientificName','Species',(v)=>`<div class="row-title"><i>${esc(v)}</i></div>`],['accession','Accession'],['length','Length',(v)=>fmt(v)],['gc','GC %'],['lsc','LSC',(v)=>fmt(v)],['ssc','SSC',(v)=>fmt(v)],['irb','IRb',(v)=>fmt(v)],['ira','IRa',(v)=>fmt(v)],['genes','Genes'],['status','Status',pill]];return `<div class="page-head"><div><div class="ey">PLASTOME LOCKER</div><h1>◉ Chloroplast Genome</h1><p>เก็บ complete plastome features แบบเดียวกับตารางผลในเปเปอร์: total length, LSC, SSC, IRa/IRb, GC, CDS/tRNA/rRNA, accession และสถานะ assembly/annotation.</p></div><div class="actions"><button class="btn primary" onclick="app.open('genome')">＋ Genome</button><button class="btn ghost" onclick="document.getElementById('gbInput').click()">⇧ Import GenBank</button></div></div><input class="hidden" id="gbInput" type="file" accept=".gb,.gbk,.genbank,.txt"> <div class="card">${table(state.genomes,cols,'genome')}</div>`}
function mapView(){const gs=state.genomes;if(!gs.length)return `<div class="page-head"><div><div class="ey">OGDRAW-STYLE VIEW</div><h1>◎ Circular cp Genome Map</h1><p>ยีนด้านใน = clockwise; ยีนด้านนอก = counterclockwise พร้อม LSC, SSC, IRb, IRa และ GC track</p></div></div><div class="card">${empty('◎','ยังไม่มี genome','Import GenBank หรือเพิ่ม genome record ก่อน')}</div>`;if(!selectedGenome||!gs.some(x=>x.id===selectedGenome))selectedGenome=gs[0].id;const g=gs.find(x=>x.id===selectedGenome);return `<div class="page-head"><div><div class="ey">CIRCULAR PLASTOME</div><h1>◎ Circular cp Genome Map</h1><p>รูปแบบการอ่านทิศทางยึดตามคำอธิบาย figure ในเปเปอร์: outside = counterclockwise, inside = clockwise; โครงสร้างหลักเป็น LSC–IRb–SSC–IRa.</p></div><div class="actions"><select class="select" id="mapGenomeSel" style="min-width:260px">${gs.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.scientificName)} ${esc(x.accession||'')}</option>`).join('')}</select><button class="btn ghost" id="exportMap">⇩ SVG</button></div></div><div class="map-shell"><div class="card map-canvas" id="mapCanvas">${circularSvg(g)}</div><div class="card"><div class="panel-title"><div><div class="ey">GENOME FEATURES</div><h2>${esc(g.scientificName)}</h2></div></div><div class="mini-grid" style="grid-template-columns:1fr 1fr"><div class="mini"><b>${fmt(g.length)}</b><span>Total bp</span></div><div class="mini"><b>${esc(g.gc||'—')}</b><span>GC %</span></div><div class="mini"><b>${fmt(g.lsc)}</b><span>LSC</span></div><div class="mini"><b>${fmt(g.ssc)}</b><span>SSC</span></div><div class="mini"><b>${fmt(g.irb)}</b><span>IRb</span></div><div class="mini"><b>${fmt(g.ira)}</b><span>IRa</span></div></div><div class="legend" style="margin-top:14px">${Object.entries(geneColors).map(([k,c])=>`<div class="legend-item"><span class="sw" style="background:${c}"></span><span>${esc(k)}</span></div>`).join('')}</div><div class="notice" style="margin-top:14px">ถ้า import GenBank ระบบจะอ่าน gene/CDS/tRNA/rRNA, strand และ sequence เพื่อวาดแผนที่/GC track โดยอัตโนมัติ</div></div></div>`}
const geneColors={'Photosystem I':'#4f7d62','Photosystem II':'#5a9465','ATP synthase':'#b7a64e','NADH dehydrogenase':'#7b9660','Cytochrome b6/f':'#bb745c','Rubisco':'#495e9d','Ribosomal protein':'#c4955f','RNA polymerase':'#8d627d','tRNA':'#6f9ca8','rRNA':'#b75858','ycf/other':'#8d8f88'};
function geneGroup(name,type=''){const n=String(name||'');if(/^psa/i.test(n))return 'Photosystem I';if(/^psb/i.test(n))return 'Photosystem II';if(/^atp/i.test(n))return 'ATP synthase';if(/^ndh/i.test(n))return 'NADH dehydrogenase';if(/^pet/i.test(n))return 'Cytochrome b6/f';if(/^rbcL/i.test(n))return 'Rubisco';if(/^(rpl|rps)/i.test(n))return 'Ribosomal protein';if(/^rpo/i.test(n))return 'RNA polymerase';if(/^trn/i.test(n)||type==='tRNA')return 'tRNA';if(/^rrn/i.test(n)||type==='rRNA')return 'rRNA';return 'ycf/other'}
function polar(cx,cy,r,a){const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
function arcPath(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),large=((a1-a0+360)%360)>180?1:0;return `M ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]}`}
function circularSvg(g){const W=760,H=700,cx=380,cy=350,R=238,len=Number(g.length)||Number(g.lsc)+Number(g.irb)+Number(g.ssc)+Number(g.ira)||150000,scale=360/len;let feats=Array.isArray(g.features)?g.features:[];let regions=[['LSC',+g.lsc||len*.55],['IRb',+g.irb||len*.16],['SSC',+g.ssc||len*.12],['IRa',+g.ira||len*.17]],sum=regions.reduce((a,x)=>a+x[1],0);if(Math.abs(sum-len)>10){const f=len/sum;regions=regions.map(x=>[x[0],x[1]*f])}let pos=0,regionSvg='';const regColor={LSC:'#dce9e1',IRb:'#ecd9ae',SSC:'#dbe9f1',IRa:'#ecd9ae'};for(const [n,l] of regions){const a0=pos*scale,a1=(pos+l)*scale;regionSvg+=`<path d="${arcPath(cx,cy,R-46,a0,a1)}" fill="none" stroke="${regColor[n]}" stroke-width="16"/><text x="${polar(cx,cy,R-46,(a0+a1)/2)[0]}" y="${polar(cx,cy,R-46,(a0+a1)/2)[1]}" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle">${n}</text>`;pos+=l}let geneSvg='';for(const f of feats.slice(0,500)){if(!f.start||!f.end)continue;const mid=((f.start+f.end)/2)*scale,a0=f.start*scale,a1=f.end*scale,inner=f.strand!==-1,r=inner?R-12:R+12,sw=14,col=geneColors[geneGroup(f.gene,f.type)]||'#999';geneSvg+=`<path d="${arcPath(cx,cy,r,a0,a1)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="butt" data-gene="${esc(f.gene||f.type)}" data-pos="${f.start}-${f.end}" class="geneArc"/>`;if((f.end-f.start)>900){const p=polar(cx,cy,inner?R-28:R+31,mid),rot=mid;geneSvg+=`<text x="${p[0]}" y="${p[1]}" font-size="7" text-anchor="middle" transform="rotate(${rot} ${p[0]} ${p[1]})">${esc(f.gene||'')}</text>`}}let gc='';if(g.sequence){const step=Math.max(100,Math.floor(g.sequence.length/240));for(let i=0;i<g.sequence.length;i+=step){const s=g.sequence.slice(i,i+step),v=(s.match(/[GC]/gi)||[]).length/Math.max(1,(s.match(/[ATGC]/gi)||[]).length),r0=R-78,r1=r0+(v-.2)*45,a=i*scale;const p0=polar(cx,cy,r0,a),p1=polar(cx,cy,r1,a);gc+=`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#9ea7a1" stroke-width="1"/>`}}return `<svg id="cpSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#d9dfda"/><circle cx="${cx}" cy="${cy}" r="${R-62}" fill="none" stroke="#e2e6e2"/>${gc}${regionSvg}${geneSvg}<text x="${cx}" y="${cy-12}" text-anchor="middle" font-size="20" font-weight="800" font-style="italic">${esc(g.scientificName||'Chloroplast genome')}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#68736b">chloroplast genome</text><text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="12" font-weight="700">${fmt(len)} bp</text><text x="${cx}" y="${cy+56}" text-anchor="middle" font-size="9" fill="#8a938d">inside genes: clockwise · outside genes: counterclockwise</text></svg>`}
function compareView(){return `<div class="page-head"><div><div class="ey">ALIGNMENT → DIVERSITY</div><h1>⇄ Compare Genome & Hotspot</h1><p>วิเคราะห์ multiple FASTA alignment เพื่อสรุป variable sites, parsimony-informative sites, pairwise distance และ nucleotide diversity (Pi) แบบ sliding window พร้อมระบุ hotspot ใกล้ gene จาก reference GenBank.</p></div><div class="actions"><button class="btn primary" onclick="document.getElementById('alnInput').click()">⇧ Import alignment FASTA</button></div></div><input class="hidden" id="alnInput" type="file" accept=".fa,.fasta,.fas,.aln,.txt"><div class="split"><div class="card"><div class="panel-title"><div><div class="ey">SLIDING WINDOW</div><h2>Nucleotide diversity (Pi)</h2></div></div><div class="form-grid"><div class="field"><label>Window (bp)</label><input class="input" id="winInput" type="number" value="${state.settings.window}"></div><div class="field"><label>Step (bp)</label><input class="input" id="stepInput" type="number" value="${state.settings.step}"></div><div class="field"><label>Hotspot cutoff (Pi)</label><input class="input" id="cutoffInput" type="number" step="0.0001" value="${state.settings.cutoff}"></div><div class="field"><label>Reference genome</label><select class="select" id="refGenomeSel"><option value="">— optional —</option>${state.genomes.map(g=>`<option value="${g.id}">${esc(g.scientificName)}</option>`).join('')}</select></div></div><div class="notice" style="margin-top:10px">Preset ปัจจุบัน: <b>${esc(paperPresets[state.settings.preset].short)}</b> · ${esc(paperPresets[state.settings.preset].pi||'')}</div><div id="compareSummary" style="margin-top:12px">${state.lastCompare?compareSummaryHtml(state.lastCompare):empty('⇄','ยังไม่มี alignment','Import multiple FASTA alignment เพื่อคำนวณ')}</div></div><div class="card"><div class="panel-title"><div><div class="ey">HOTSPOT TABLE</div><h2>Highly divergent regions</h2></div></div><div id="hotspotList">${state.lastCompare?hotspotHtml(state.lastCompare.hotspots||[]):empty('⌁','ยังไม่มี hotspot','ผลจะถูกสร้างจาก sliding-window Pi')}</div></div></div><div class="card" style="margin-top:14px"><div class="panel-title"><div><div class="ey">PI PROFILE</div><h2>Nucleotide diversity across plastome</h2></div><button class="btn ghost" id="exportPi" ${state.lastCompare?'':'disabled'}>⇩ CSV</button></div><div class="chart" id="piChart">${state.lastCompare?piChartSvg(state.lastCompare.windows||[],state.settings.cutoff):empty('⌁','ยังไม่มีกราฟ','Import alignment ก่อน')}</div></div>`}
function compareSummaryHtml(r){return `<div class="mini-grid"><div class="mini"><b>${fmt(r.taxa)}</b><span>Taxa</span></div><div class="mini"><b>${fmt(r.length)}</b><span>Alignment bp</span></div><div class="mini"><b>${fmt(r.variable)}</b><span>Variable sites</span></div><div class="mini"><b>${fmt(r.parsimony)}</b><span>Parsimony informative</span></div></div>${r.distances?.length?`<div class="table-wrap" style="margin-top:10px"><table style="min-width:600px"><thead><tr><th>Pair</th><th>p-distance</th><th>K2P</th></tr></thead><tbody>${r.distances.slice(0,30).map(x=>`<tr><td>${esc(x.a)} ↔ ${esc(x.b)}</td><td>${x.p.toFixed(6)}</td><td>${Number.isFinite(x.k2p)?x.k2p.toFixed(6):'NA'}</td></tr>`).join('')}</tbody></table></div>`:''}`}
function hotspotHtml(h){if(!h.length)return empty('⌁','ไม่พบ hotspot เหนือ cutoff','ปรับ cutoff หรือใช้ alignment อื่น');return `<div class="hotspot-list">${h.map(x=>`<div class="hotspot"><div><b>${fmt(x.start)}–${fmt(x.end)} bp ${x.annotation?'· '+esc(x.annotation):''}</b><span>midpoint ${fmt(x.mid)}</span></div><b>Pi ${x.pi.toFixed(5)}</b></div>`).join('')}</div>`}
function piChartSvg(rows,cut){if(!rows.length)return '';const W=1000,H=330,pad=45,maxX=Math.max(...rows.map(x=>x.mid)),maxY=Math.max(cut*1.2,...rows.map(x=>x.pi),.0001),sx=x=>pad+(x/maxX)*(W-pad*1.4),sy=y=>H-pad-(y/maxY)*(H-pad*1.5),pts=rows.map(x=>`${sx(x.mid)},${sy(x.pi)}`).join(' ');return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><line x1="${pad}" y1="${H-pad}" x2="${W-18}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="18" x2="${pad}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="${sy(cut)}" x2="${W-18}" y2="${sy(cut)}" stroke="#a35b53" stroke-dasharray="5 5"/><text x="${W-22}" y="${sy(cut)-5}" font-size="10" text-anchor="end" fill="#9a554e">cutoff ${cut}</text><polyline points="${pts}" fill="none" stroke="#607f70" stroke-width="2"/>${rows.filter(x=>x.pi>=cut).map(x=>`<circle cx="${sx(x.mid)}" cy="${sy(x.pi)}" r="3.5" fill="#a35b53"/>`).join('')}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="11">Position (bp)</text><text x="14" y="${H/2}" font-size="11" transform="rotate(-90 14 ${H/2})">Nucleotide diversity (Pi)</text></svg>`}

function parseGenBank(text){
 const lines=text.split(/\r?\n/);
 const locus=lines.find(x=>x.startsWith('LOCUS'))||'';
 const acc=(lines.find(x=>x.startsWith('ACCESSION'))||'').trim().split(/\s+/)[1]||'';
 const definition=(lines.find(x=>x.startsWith('DEFINITION'))||'').replace('DEFINITION','').trim();
 const locusMatch=locus.match(/\s(\d+)\s+bp/i);
 const locusLength=locusMatch?+locusMatch[1]:0;
 let seq='', inOrigin=false, features=[], cur=null;
 for(const line of lines){
   if(line.startsWith('ORIGIN')){inOrigin=true;continue;}
   if(inOrigin){
     if(line.startsWith('//')){inOrigin=false;continue;}
     seq+=line.replace(/[^a-zA-Z]/g,'');
     continue;
   }
   const featureMatch=line.match(/^\s{5}(gene|CDS|tRNA|rRNA)\s+(.+)$/);
   if(featureMatch){
     if(cur)features.push(cur);
     const loc=featureMatch[2];
     const nums=[...loc.matchAll(/(\d+)/g)].map(x=>+x[1]);
     cur={type:featureMatch[1],start:nums.length?Math.min(...nums):0,end:nums.length?Math.max(...nums):0,strand:/complement/.test(loc)?-1:1,gene:''};
   }else if(cur){
     const gm=line.match(/\/gene="([^"]+)"/);
     const pm=line.match(/\/product="([^"]+)"/);
     if(gm)cur.gene=gm[1];
     else if(!cur.gene&&pm)cur.gene=pm[1].split(' ')[0];
   }
 }
 if(cur)features.push(cur);
 const seen=new Set();
 features=features.filter(x=>x.start&&x.end).filter(x=>{const key=[x.type,x.start,x.end,x.gene].join('|');if(seen.has(key))return false;seen.add(key);return true;});
 const geneNames=new Set(features.filter(x=>x.type==='gene'||x.type==='CDS').map(x=>x.gene).filter(Boolean));
 const cds=features.filter(x=>x.type==='CDS').length;
 const trna=features.filter(x=>x.type==='tRNA').length;
 const rrna=features.filter(x=>x.type==='rRNA').length;
 const canon=(seq.match(/[ATGC]/gi)||[]).length;
 const gc=canon?((seq.match(/[GC]/gi)||[]).length/canon*100):0;
 const scientificName=definition?definition.split(/ chloroplast| plastid| complete/i)[0].replace(/,.*$/,'').trim():'Imported plastome';
 return {scientificName,accession:acc,length:locusLength||seq.length,gc:gc?gc.toFixed(2):'',features,sequence:seq.toUpperCase(),genes:geneNames.size||'',cds,trna,rrna,status:'Annotated',notes:'Imported from GenBank'};
}
function parseFasta(text){const out=[];let name='',seq='';for(const line of text.split(/\r?\n/)){if(line.startsWith('>')){if(name)out.push({name,seq:seq.toUpperCase()});name=line.slice(1).trim().split(/\s+/)[0]||'seq'+(out.length+1);seq=''}else seq+=line.replace(/\s/g,'')}if(name)out.push({name,seq:seq.toUpperCase()});return out}
function analyzeAlignment(text,window,step,cutoff,refGenomeId){const taxa=parseFasta(text),length=Math.max(...taxa.map(x=>x.seq.length),0);if(taxa.length<2||!length)throw new Error('Alignment ต้องมีอย่างน้อย 2 sequences');let variable=0,parsimony=0;for(let i=0;i<length;i++){const counts={};taxa.forEach(t=>{const b=t.seq[i];if(/[ACGT]/.test(b))counts[b]=(counts[b]||0)+1});const vals=Object.values(counts);if(vals.length>1)variable++;if(vals.filter(v=>v>=2).length>=2)parsimony++}const distances=[];for(let i=0;i<taxa.length;i++)for(let j=i+1;j<taxa.length;j++){let valid=0,diff=0,ts=0,tv=0;for(let k=0;k<length;k++){const a=taxa[i].seq[k],b=taxa[j].seq[k];if(!/[ACGT]/.test(a)||!/[ACGT]/.test(b))continue;valid++;if(a!==b){diff++;if((a==='A'&&b==='G')||(a==='G'&&b==='A')||(a==='C'&&b==='T')||(a==='T'&&b==='C'))ts++;else tv++}}const p=valid?diff/valid:NaN,P=valid?ts/valid:0,Q=valid?tv/valid:0,A=1-2*P-Q,B=1-2*Q,k2p=A>0&&B>0?-.5*Math.log(A)-.25*Math.log(B):NaN;distances.push({a:taxa[i].name,b:taxa[j].name,p,k2p})}const windows=[];window=Math.max(20,+window||1000);step=Math.max(1,+step||500);for(let start=0;start<length;start+=step){const end=Math.min(length,start+window);if(end-start<Math.min(50,window/3))break;let siteSum=0,sites=0;for(let k=start;k<end;k++){let pairs=0,d=0;for(let i=0;i<taxa.length;i++)for(let j=i+1;j<taxa.length;j++){const a=taxa[i].seq[k],b=taxa[j].seq[k];if(/[ACGT]/.test(a)&&/[ACGT]/.test(b)){pairs++;if(a!==b)d++}}if(pairs){siteSum+=d/pairs;sites++}}windows.push({start:start+1,end,mid:Math.round((start+1+end)/2),pi:sites?siteSum/sites:0})}const ref=state.genomes.find(x=>x.id===refGenomeId),hotspots=windows.filter(x=>x.pi>=cutoff).map(x=>({...x,annotation:ref?annotatePosition(ref,x.mid):''}));return {taxa:taxa.length,length,variable,parsimony,distances,windows,hotspots,createdAt:new Date().toISOString()}}
function annotatePosition(g,pos){const f=(g.features||[]).filter(x=>pos>=x.start&&pos<=x.end).sort((a,b)=>(a.end-a.start)-(b.end-b.start))[0];if(f)return f.gene||f.type;let left=null,right=null;for(const x of g.features||[]){if(x.end<pos&&(!left||x.end>left.end))left=x;if(x.start>pos&&(!right||x.start<right.start))right=x}return left&&right?`${left.gene||left.type}–${right.gene||right.type}`:''}
function findSSRs(seq,preset){const th=preset==='solanum'?[10,6,5,5,5,5]:[10,4,4,3,3,3],out=[],N=seq.length;for(let unit=1;unit<=6;unit++){const min=th[unit-1];for(let i=0;i<N-unit*min;){const motif=seq.slice(i,i+unit);if(!/^[ACGT]+$/.test(motif)){i++;continue}let c=1,j=i+unit;while(j+unit<=N&&seq.slice(j,j+unit)===motif){c++;j+=unit}if(c>=min){out.push({type:['mono','di','tri','tetra','penta','hexa'][unit-1],motif,count:c,start:i+1,end:j});i=j}else i++}}return out}
function parseCsv(text){const lines=text.trim().split(/\r?\n/);if(!lines.length)return[];const split=l=>{const a=[];let q=false,s='';for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){s+='"';i++}else q=!q}else if(c===','&&!q){a.push(s.trim());s=''}else s+=c}a.push(s.trim());return a};const h=split(lines[0]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,''));return lines.slice(1).map(l=>{const v=split(l),o={};h.forEach((k,i)=>o[k]=v[i]??'');return {gene:o.gene||o.name||'',a3:+o.a3,t3:+o.t3,g3:+o.g3,c3:+o.c3,gc12:+o.gc12,gc3:+o.gc3}}).filter(r=>[r.a3,r.t3,r.g3,r.c3,r.gc12,r.gc3].some(Number.isFinite))}
function linearSlope(pts){pts=pts.filter(x=>x.every(Number.isFinite));if(pts.length<2)return NaN;const mx=pts.reduce((a,x)=>a+x[0],0)/pts.length,my=pts.reduce((a,x)=>a+x[1],0)/pts.length,num=pts.reduce((a,x)=>a+(x[0]-mx)*(x[1]-my),0),den=pts.reduce((a,x)=>a+(x[0]-mx)**2,0);return den?num/den:NaN}
function corr(pts){pts=pts.filter(x=>x.every(Number.isFinite));if(pts.length<2)return NaN;const mx=pts.reduce((a,x)=>a+x[0],0)/pts.length,my=pts.reduce((a,x)=>a+x[1],0)/pts.length,num=pts.reduce((a,x)=>a+(x[0]-mx)*(x[1]-my),0),dx=Math.sqrt(pts.reduce((a,x)=>a+(x[0]-mx)**2,0)),dy=Math.sqrt(pts.reduce((a,x)=>a+(x[1]-my)**2,0));return dx&&dy?num/(dx*dy):NaN}
function parseNewick(s){let ancestors=[],tree={},tokens=s.split(/\s*(;|\(|\)|,|:)\s*/).filter(x=>x!==''),node=tree;for(let i=0;i<tokens.length;i++){const t=tokens[i];if(t==='('){const child={children:[]};node.children=node.children||[];node.children.push(child);ancestors.push(node);node=child}else if(t===','){const sib={};ancestors[ancestors.length-1].children.push(sib);node=sib}else if(t===')'){node=ancestors.pop()}else if(t===':'){}else if(t===';'){}else{const prev=tokens[i-1];if(prev===':')node.length=parseFloat(t)||0;else node.name=t}}return tree.children?.[0]||tree}
function treeSvg(newick){let root;try{root=parseNewick(newick)}catch{return '<div class="empty">Invalid Newick</div>'}const leaves=[];function count(n){if(!n.children?.length){leaves.push(n);n.leaves=1;return 1}n.leaves=n.children.reduce((a,c)=>a+count(c),0);return n.leaves}count(root);const W=1050,H=Math.max(420,leaves.length*25+40),left=20,right=220,unit=(W-left-right)/Math.max(1,maxDepth(root));let yi=25;function layout(n,d=0){n.x=left+d*unit;if(!n.children?.length)n.y=yi,yi+=25;else{n.children.forEach(c=>layout(c,d+1));n.y=(n.children[0].y+n.children[n.children.length-1].y)/2}}layout(root);let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/>`;function draw(n){if(n.children?.length){const min=n.children[0].y,max=n.children[n.children.length-1].y;s+=`<line x1="${n.x}" y1="${min}" x2="${n.x}" y2="${max}" stroke="#98a39c"/>`;n.children.forEach(c=>{s+=`<line x1="${n.x}" y1="${c.y}" x2="${c.x}" y2="${c.y}" stroke="#607f70"/>`;draw(c)})}if(n.name){s+=`<text x="${n.x+6}" y="${n.y+4}" font-size="10" ${n.children?.length?'font-weight="800"':''}>${esc(n.name)}</text>`}}draw(root);return s+'</svg>'}
function maxDepth(n,d=0){if(!n.children?.length)return d;return Math.max(...n.children.map(c=>maxDepth(c,d+1)))}
function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(DBSTORE,{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function storeFile(file,meta){let stored=false;if(file.size<=20*1024*1024){try{const db=await openDb(),buf=await file.arrayBuffer();await new Promise((res,rej)=>{const tx=db.transaction(DBSTORE,'readwrite');tx.objectStore(DBSTORE).put({id:meta.id,name:file.name,type:file.type,size:file.size,buf});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});stored=true}catch{}}meta.stored=stored;state.files.unshift(meta);activity('เพิ่มไฟล์',file.name);save();render()}
async function loadVault(id){const db=await openDb(),row=await new Promise((res,rej)=>{const r=db.transaction(DBSTORE).objectStore(DBSTORE).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(!row)return toast('ไม่พบไฟล์');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([row.buf],{type:row.type||'application/octet-stream'}));a.download=row.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function removeFile(id){state.files=state.files.filter(x=>x.id!==id);try{const db=await openDb();db.transaction(DBSTORE,'readwrite').objectStore(DBSTORE).delete(id)}catch{}save();render()}
function formatBytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(1)+' GB'}
function inferKind(name){const n=name.toLowerCase();if(/fastq|fq/.test(n))return 'Raw FASTQ';if(/\.gb|gbk|genbank/.test(n))return 'GenBank';if(/fasta|\.fa$|\.fas$/.test(n))return 'FASTA';if(/gff|gtf/.test(n))return 'Annotation';if(/nwk|newick|tree|\.tre$/.test(n))return 'Newick';if(/xmfa|mauve/.test(n))return 'Alignment / Mauve';if(/csv|tsv/.test(n))return 'Results table';return 'Research file'}
function usePreset(k){state.settings.preset=k;if(k==='solanum'){state.settings.window=1000;state.settings.step=200;state.settings.cutoff=.0015}else if(k==='ipomoea'){state.settings.window=1000;state.settings.step=500;state.settings.cutoff=.015}else{state.settings.window=1000;state.settings.step=500}activity('เปลี่ยน paper preset',paperPresets[k].short);save();render()}
function backup(){download('cpgenome-workbench-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json')}
async function restore(file){try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.genomes))throw new Error('invalid');state={...structuredClone(defaults),...x,version:2};save();render();toast('Restore สำเร็จ')}catch{toast('ไฟล์ backup ไม่ถูกต้อง')}}
function exportSvg(){const svg=document.getElementById('cpSvg');if(svg)download('cpgenome-map.svg',new XMLSerializer().serializeToString(svg),'image/svg+xml')}
function wireView(){
 const mapSel=document.getElementById('mapGenomeSel');if(mapSel)mapSel.onchange=e=>{selectedGenome=e.target.value;render()};const em=document.getElementById('exportMap');if(em)em.onclick=exportSvg;document.querySelectorAll('.geneArc').forEach(el=>{el.onmousemove=e=>{const t=document.getElementById('tip');t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px';t.textContent=`${el.dataset.gene} · ${el.dataset.pos}`};el.onmouseleave=()=>document.getElementById('tip').style.display='none'});
 const gb=document.getElementById('gbInput');if(gb)gb.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const g=parseGenBank(await f.text());g.id=uid('CPG');const p=paperPresets[state.settings.preset];g.assemblyTool=p.assembly;g.annotationTool=p.annotation;g.referenceSeed=p.seed;state.genomes.unshift(g);await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'GenBank',genomeId:g.id});activity('Import GenBank',g.scientificName);save();render()}catch(err){toast('อ่าน GenBank ไม่สำเร็จ: '+err.message)}};
 const vi=document.getElementById('vaultInput');if(vi)vi.onchange=async e=>{for(const f of e.target.files)await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:inferKind(f.name)})};
 const ai=document.getElementById('alnInput');if(ai)ai.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{state.settings.window=+document.getElementById('winInput').value||1000;state.settings.step=+document.getElementById('stepInput').value||500;state.settings.cutoff=+document.getElementById('cutoffInput').value||0;state.lastCompare=analyzeAlignment(await f.text(),state.settings.window,state.settings.step,state.settings.cutoff,document.getElementById('refGenomeSel').value);await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Multiple alignment'});activity('วิเคราะห์ alignment',`${state.lastCompare.taxa} taxa · ${state.lastCompare.length} bp`);save();render()}catch(err){toast(err.message)}};
 const ep=document.getElementById('exportPi');if(ep)ep.onclick=()=>{if(!state.lastCompare)return;download('nucleotide-diversity.csv','start,end,mid,pi\n'+state.lastCompare.windows.map(x=>[x.start,x.end,x.mid,x.pi].join(',')).join('\n'),'text/csv')};
 const ti=document.getElementById('treeInput');if(ti)ti.onchange=async e=>{const f=e.target.files[0];if(!f)return;const nw=(await f.text()).trim();state.trees.unshift({id:uid('TREE'),name:f.name,dataset:'Other',method:'Imported',model:'',outgroup:'',software:'',newick:nw,createdAt:new Date().toISOString()});await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Newick'});activity('Import Newick',f.name);save();render()};const ts=document.getElementById('treeSel');if(ts)ts.onchange=()=>{const tr=state.trees.find(x=>x.id===ts.value);document.getElementById('treeCanvas').innerHTML=tr?treeSvg(tr.newick):empty('⑂','เลือก tree','')};
 const ci=document.getElementById('codonInput');if(ci)ci.onchange=async e=>{const f=e.target.files[0];if(!f)return;state.codonRows=parseCsv(await f.text());await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Codon CSV'});activity('Import codon CSV',`${state.codonRows.length} genes`);save();render()};
 const sp=document.getElementById('setPreset');if(sp){document.getElementById('saveSettings').onclick=()=>{state.settings.preset=sp.value;state.settings.cutoff=+document.getElementById('setCutoff').value;state.settings.window=+document.getElementById('setWindow').value;state.settings.step=+document.getElementById('setStep').value;save();render();toast('บันทึกแล้ว')}}document.getElementById('backup2')?.addEventListener('click',backup);document.getElementById('restore2')?.addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('resetAll')?.addEventListener('click',()=>{if(confirm('ล้าง metadata ทั้งหมด?')){localStorage.removeItem(STORE);state=structuredClone(defaults);save();render()}})
}
window.app={setView,open:(t)=>openModal(t),edit:(t,id)=>openModal(t,id),del:(t,id)=>{if(!confirm('ลบรายการนี้?'))return;const list=getList(t),i=list.findIndex(x=>x.id===id);if(i>=0){const r=list[i];list.splice(i,1);activity('ลบ '+t,r.scientificName||r.sampleId||r.name||id);save();render()}},usePreset,loadVault,removeFile};
document.getElementById('quickBtn').onclick=()=>openModal('specimen');document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>e.target.files[0]&&restore(e.target.files[0]);document.getElementById('modalForm').onsubmit=submitModal;document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancelModal').onclick=closeModal;document.getElementById('modalBg').onclick=closeModal;
