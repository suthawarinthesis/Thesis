function ensureSettings(){
 state.settings=state.settings||{};
 state.settings.hybridSources={...structuredClone(defaults.settings.hybridSources),...(state.settings.hybridSources||{})};
 if(!state.settings.preset)state.settings.preset='solanum';
 if(!Number.isFinite(+state.settings.window))state.settings.window=1000;
 if(!Number.isFinite(+state.settings.step))state.settings.step=500;
 if(!Number.isFinite(+state.settings.cutoff))state.settings.cutoff=.0015;
}
function currentPreset(){
 ensureSettings();
 if(state.settings.preset!=='hybrid')return paperPresets[state.settings.preset]||paperPresets.solanum;
 const h=state.settings.hybridSources;
 const p={name:'Hybrid / Mixed Paper Workflow',short:'Hybrid / Mixed',note:'เลือกแหล่งวิธีแยกตามขั้นตอน แล้วผสม workflow ให้เหมาะกับโครงการของคุณ โดยยังเก็บ provenance ว่าแต่ละขั้นอ้างจาก paper ใด'};
 for(const [stage,,fields] of hybridStages){
   const src=paperPresets[h[stage]]||paperPresets.solanum;
   fields.forEach(f=>{if(src[f]!==undefined)p[f]=src[f]});
 }
 p.sources={...h};
 return p;
}

function setHybridSource(stage,key){
 ensureSettings();
 if(!hybridStages.some(x=>x[0]===stage)||!paperPresets[key])return;
 state.settings.hybridSources[stage]=key;
 state.settings.preset='hybrid';
 applyPresetDefaults('hybrid');
 activity('ปรับ Hybrid methods',`${stage} ← ${paperPresets[key].short}`);
 save();render();
}
function applyPresetDefaults(k){
 const p=k==='hybrid'?currentPreset():paperPresets[k]||paperPresets.solanum;
 if(k==='solanum'){state.settings.window=1000;state.settings.step=200;state.settings.cutoff=.0015}
 else if(k==='ipomoea'){state.settings.window=1000;state.settings.step=500;state.settings.cutoff=.015}
 else if(k==='barleria'){state.settings.window=1000;state.settings.step=500;state.settings.cutoff=.0015}
 else if(k==='cratoxylum'){state.settings.window=1000;state.settings.step=500;state.settings.cutoff=.0015}
 else if(k==='hybrid'){
   const div=state.settings.hybridSources?.diversity||'solanum';
   if(div==='solanum'){state.settings.window=1000;state.settings.step=200;state.settings.cutoff=.0015}
   else if(div==='ipomoea'){state.settings.window=1000;state.settings.step=500;state.settings.cutoff=.015}
   else {state.settings.window=1000;state.settings.step=500;if(!state.settings.cutoff)state.settings.cutoff=.0015}
 }
 return p;
}

function selectedGenomeRecords(){const ids=new Set(state.phyloGenomeIds||[]);return state.genomes.filter(g=>ids.has(g.id))}
function genomesToFasta(rows){return rows.filter(g=>g.sequence).map(g=>`>${nwLabel(g.scientificName||g.id)}${g.accession?'|'+g.accession:''}\n${String(g.sequence||'').match(/.{1,80}/g)?.join('\n')||''}`).join('\n')}
function preparePhyloFromLocker(){const rows=selectedGenomeRecords().filter(g=>g.sequence);if(rows.length<2)return toast('เลือก genome ที่มี sequence อย่างน้อย 2 records');state.phyloGenomeFasta=genomesToFasta(rows);state.phyloGenomePreparedAt=new Date().toISOString();state.phyloPreferGenomeFasta=true;activity('เตรียม GenBank → Phylogeny',`${rows.length} genomes`);state.active='phylogeny';save();render()}
function exportSelectedGenomeFasta(){const rows=selectedGenomeRecords().filter(g=>g.sequence);if(!rows.length)return toast('ยังไม่ได้เลือก genome ที่มี sequence');download('cpgenome-selected-'+rows.length+'.fasta',genomesToFasta(rows),'text/plain')}
function mapGenomeFromLocker(id){selectedGenome=id;state.active='map';save();render()}
function phyloGenomePickerHtml(){const rows=state.genomes.filter(g=>g.sequence),selected=new Set(state.phyloGenomeIds||[]);if(!rows.length)return empty('⑂','ยังไม่มี GenBank/FASTA sequence','Import GenBank หรือ FASTA ใน cp Genome Locker ก่อน');return `<div class="phylo-genome-picker">${rows.map(g=>`<label class="phylo-genome-item"><input type="checkbox" ${selected.has(g.id)?'checked':''} onchange="app.toggleGenomePhylo('${g.id}',this.checked)"><span><b><i>${esc(g.scientificName||'Unknown')}</i></b><small>${esc(g.accession||g.id)} · ${fmt(g.length)} bp · ${esc(genomeSourceLabel(g))}</small></span><span class="source-badge ${genomeSourceLabel(g).startsWith('FASTA')?'fa':''}">${genomeSourceLabel(g).startsWith('GenBank')?'GB':'SEQ'}</span></label>`).join('')}</div>`}
function phyloPreparedStatus(){const taxa=parseFasta(state.phyloGenomeFasta||''),lengths=[...new Set(taxa.map(t=>t.seq.length))];if(!taxa.length)return `<div class="align-status">ยังไม่ได้เตรียม dataset จาก Genome Locker</div>`;if(lengths.length===1)return `<div class="align-status good"><b>${taxa.length} sequences prepared</b> · length ${fmt(lengths[0])} bp เท่ากัน แต่ควรตรวจว่าเป็น multiple alignment จริงก่อนสร้าง inference tree.</div>`;return `<div class="align-status warn"><b>${taxa.length} raw genome sequences prepared</b> · ความยาวต่างกัน (${lengths.map(fmt).slice(0,6).join(', ')}${lengths.length>6?'…':''} bp) จึงต้อง MAFFT/align ก่อนสร้าง NJ/ML/BI tree.</div>`}
function genomeView(){const cols=[['scientificName','Species',(v,r)=>`<div class="row-title"><i>${esc(v)}</i><div class="row-sub">${esc(r.family||'')} ${r.genus?'· '+esc(r.genus):''}</div></div>`],['accession','Accession'],['length','Length',(v)=>fmt(v)],['gc','GC %'],['lsc','LSC',(v)=>fmt(v)],['ssc','SSC',(v)=>fmt(v)],['irb','IRb',(v)=>fmt(v)],['ira','IRa',(v)=>fmt(v)],['genes','Genes'],['status','Status',pill]];const p=currentPreset();return `<div class="page-head"><div><div class="ey">SPECIES LOCKER · GENBANK / FASTA IMPORT</div><h1>◉ cp Genome Locker</h1><p>คลังหลักของ cp genome แยกตาม <b>Species → accession</b> เพื่อค้นง่าย และเป็นจุดเริ่มต้นของ Circular Map, Compare, Repeats และ <b>GenBank → Phylogeny</b>.</p></div><div class="actions"><button class="btn primary" onclick="app.open('genome')">＋ Genome record</button><button class="btn ghost" onclick="document.getElementById('gbInput').click()">⇧ GenBank file</button><button class="btn ghost" onclick="document.getElementById('fastaInput').click()">⇧ FASTA file</button></div></div>

function circularSvg(g){const W=760,H=700,cx=380,cy=350,R=238,len=Number(g.length)||Number(g.lsc)+Number(g.irb)+Number(g.ssc)+Number(g.ira)||150000,scale=360/len;let feats=Array.isArray(g.features)?g.features:[];let regions=[['LSC',+g.lsc||len*.55],['IRb',+g.irb||len*.16],['SSC',+g.ssc||len*.12],['IRa',+g.ira||len*.17]],sum=regions.reduce((a,x)=>a+x[1],0);if(Math.abs(sum-len)>10){const f=len/sum;regions=regions.map(x=>[x[0],x[1]*f])}let pos=0,regionSvg='';const regColor={LSC:'#dce9e1',IRb:'#ecd9ae',SSC:'#dbe9f1',IRa:'#ecd9ae'};for(const [n,l] of regions){const a0=pos*scale,a1=(pos+l)*scale;regionSvg+=`<path d="${arcPath(cx,cy,R-46,a0,a1)}" fill="none" stroke="${regColor[n]}" stroke-width="16"/><text x="${polar(cx,cy,R-46,(a0+a1)/2)[0]}" y="${polar(cx,cy,R-46,(a0+a1)/2)[1]}" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle">${n}</text>`;pos+=l}let geneSvg='';for(const f of feats.slice(0,500)){if(!f.start||!f.end)continue;const mid=((f.start+f.end)/2)*scale,a0=f.start*scale,a1=f.end*scale,inner=f.strand!==-1,r=inner?R-12:R+12,sw=14,col=geneColors[geneGroup(f.gene,f.type)]||'#999';geneSvg+=`<path d="${arcPath(cx,cy,r,a0,a1)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="butt" data-gene="${esc(f.gene||f.type)}" data-pos="${f.start}-${f.end}" class="geneArc"/>`;if((f.end-f.start)>900){const p=polar(cx,cy,inner?R-28:R+31,mid),rot=mid;geneSvg+=`<text x="${p[0]}" y="${p[1]}" font-size="7" text-anchor="middle" transform="rotate(${rot} ${p[0]} ${p[1]})">${esc(f.gene||'')}</text>`}}let gc='';if(g.sequence){const step=Math.max(100,Math.floor(g.sequence.length/240));for(let i=0;i<g.sequence.length;i+=step){const s=g.sequence.slice(i,i+step),v=(s.match(/[GC]/gi)||[]).length/Math.max(1,(s.match(/[ATGC]/gi)||[]).length),r0=R-78,r1=r0+(v-.2)*45,a=i*scale;const p0=polar(cx,cy,r0,a),p1=polar(cx,cy,r1,a);gc+=`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#9ea7a1" stroke-width="1"/>`}}return `<svg id="cpSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#d9dfda"/><circle cx="${cx}" cy="${cy}" r="${R-62}" fill="none" stroke="#e2e6e2"/>${gc}${regionSvg}${geneSvg}<text x="${cx}" y="${cy-12}" text-anchor="middle" font-size="20" font-weight="800" font-style="italic">${esc(g.scientificName||'Chloroplast genome')}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#68736b">chloroplast genome</text><text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="12" font-weight="700">${fmt(len)} bp</text><text x="${cx}" y="${cy+56}" text-anchor="middle" font-size="9" fill="#8a938d">inside genes: clockwise · outside genes: counterclockwise</text></svg>`}
function compareView(){const p=currentPreset();return `<div class="page-head"><div><div class="ey">ALIGNMENT → DIVERSITY</div><h1>⇄ Compare Genome & Hotspot</h1><p>รับ multiple FASTA alignment ทั้งแบบอัปโหลดไฟล์หรือวางโค้ด เพื่อสรุป variable sites, parsimony-informative sites, pairwise p-distance/K2P และ nucleotide diversity (Pi) แบบ sliding window พร้อม hotspot annotation จาก reference GenBank.</p></div><div class="actions"><button class="btn primary" onclick="document.getElementById('alnInput').click()">⇧ Import alignment FASTA</button></div></div><input class="hidden" id="alnInput" type="file" accept=".fa,.fasta,.fas,.aln,.txt">
<div class="split"><div class="card"><div class="panel-title"><div><div class="ey">ALIGNMENT INPUT + SLIDING WINDOW</div><h2>Multiple FASTA / nucleotide diversity</h2></div></div>
<textarea id="alignmentPaste" class="textarea codebox compact" placeholder="วาง aligned FASTA ที่นี่ หรืออัปโหลดไฟล์ด้านบน">${esc(state.lastAlignmentText||'')}</textarea>
<div class="form-grid" style="margin-top:10px"><div class="field"><label>Window (bp)</label><input class="input" id="winInput" type="number" value="${state.settings.window}"></div><div class="field"><label>Step (bp)</label><input class="input" id="stepInput" type="number" value="${state.settings.step}"></div><div class="field"><label>Hotspot cutoff (Pi)</label><input class="input" id="cutoffInput" type="number" step="0.0001" value="${state.settings.cutoff}"></div><div class="field"><label>Reference genome</label><select class="select" id="refGenomeSel"><option value="">— optional —</option>${state.genomes.map(g=>`<option value="${g.id}">${esc(g.scientificName)}</option>`).join('')}</select></div></div>
<div class="actions" style="margin-top:10px"><button class="btn primary" id="runPasteAlignment">▶ Analyze pasted alignment</button><button class="btn ghost" id="sendToPhylo">⑂ ส่ง alignment ไป Phylogeny</button></div>
<div class="notice" style="margin-top:10px">Preset ปัจจุบัน: <b>${esc(p.short)}</b> · ${esc(p.pi||'')}</div><div id="compareSummary" style="margin-top:12px">${state.lastCompare?compareSummaryHtml(state.lastCompare):empty('⇄','ยังไม่มี alignment','Import หรือ paste multiple FASTA alignment เพื่อคำนวณ')}</div></div>

<div class="card" style="margin-top:14px"><div class="panel-title"><div><div class="ey">NUCLEOTIDE DIVERSITY</div><h2>Pi sliding-window plot</h2></div><button class="btn tiny ghost" id="exportPi">⇩ CSV</button></div><div class="chart">${state.lastCompare?piChartSvg(state.lastCompare.windows,state.settings.cutoff):empty('⌁','ยังไม่มี plot','')}</div></div>`}
function compareSummaryHtml(r){return `<div class="mini-grid"><div class="mini"><b>${fmt(r.taxa)}</b><span>Taxa</span></div><div class="mini"><b>${fmt(r.length)}</b><span>Alignment bp</span></div><div class="mini"><b>${fmt(r.variable)}</b><span>Variable sites</span></div><div class="mini"><b>${fmt(r.parsimony)}</b><span>Parsimony informative</span></div></div>${r.distances?.length?`<div class="table-wrap" style="margin-top:10px"><table style="min-width:600px"><thead><tr><th>Pair</th><th>p-distance</th><th>K2P</th></tr></thead><tbody>${r.distances.slice(0,30).map(x=>`<tr><td>${esc(x.a)} ↔ ${esc(x.b)}</td><td>${x.p.toFixed(6)}</td><td>${Number.isFinite(x.k2p)?x.k2p.toFixed(6):'NA'}</td></tr>`).join('')}</tbody></table></div>`:''}`}
function hotspotHtml(h){if(!h.length)return empty('⌁','ไม่พบ hotspot เหนือ cutoff','ปรับ cutoff หรือใช้ alignment อื่น');return `<div class="hotspot-list">${h.map(x=>`<div class="hotspot"><div><b>${fmt(x.start)}–${fmt(x.end)} bp ${x.annotation?'· '+esc(x.annotation):''}</b><span>midpoint ${fmt(x.mid)}</span></div><b>Pi ${x.pi.toFixed(5)}</b></div>`).join('')}</div>`}
function piChartSvg(rows,cut){if(!rows.length)return '';const W=1000,H=330,pad=45,maxX=Math.max(...rows.map(x=>x.mid)),maxY=Math.max(cut*1.2,...rows.map(x=>x.pi),.0001),sx=x=>pad+(x/maxX)*(W-pad*1.4),sy=y=>H-pad-(y/maxY)*(H-pad*1.5),pts=rows.map(x=>`${sx(x.mid)},${sy(x.pi)}`).join(' ');return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><line x1="${pad}" y1="${H-pad}" x2="${W-18}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="18" x2="${pad}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="${sy(cut)}" x2="${W-18}" y2="${sy(cut)}" stroke="#a35b53" stroke-dasharray="5 5"/><text x="${W-22}" y="${sy(cut)-5}" font-size="10" text-anchor="end" fill="#9a554e">cutoff ${cut}</text><polyline points="${pts}" fill="none" stroke="#607f70" stroke-width="2"/>${rows.filter(x=>x.pi>=cut).map(x=>`<circle cx="${sx(x.mid)}" cy="${sy(x.pi)}" r="3.5" fill="#a35b53"/>`).join('')}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="11">Position (bp)</text><text x="14" y="${H/2}" font-size="11" transform="rotate(-90 14 ${H/2})">Nucleotide diversity (Pi)</text></svg>`}
function repeatView(){const p=currentPreset(),g=state.genomes.find(x=>x.sequence)||null;const quick=g?findSSRs(g.sequence,state.settings.preset==='hybrid'?(state.settings.hybridSources?.repeats||'ipomoea'):state.settings.preset):[];return `<div class="page-head"><div><div class="ey">REPEAT ANALYSIS</div><h1>≋ SSR / Large / Tandem Repeats</h1><p>ระบบมี quick SSR scan ใน browser และมีที่เก็บผล REPuter / Tandem Repeat Finder เพื่อให้ workflow สอดคล้องกับเปเปอร์โดยไม่อ้างว่าหน้าเว็บแทนเครื่องมือเฉพาะทางทั้งหมด.</p></div></div><div class="split"><div class="card"><div class="panel-title"><div><div class="ey">CURRENT PRESET</div><h2>${esc(p.short)}</h2></div></div><div class="preset"><h3>MISA-style thresholds</h3><p>${esc(p.ssr)}</p><h3>Large repeats</h3><p>${esc(p.large||'')}</p>${p.tandem?`<h3>Tandem repeats</h3><p>${esc(p.tandem)}</p>`:''}</div><div class="notice">Quick SSR จะใช้ sequence จาก GenBank ที่ import เข้ามา และรายงาน motif/position/count. สำหรับ publication-grade results แนะนำเก็บผล MISA/REPuter/TRF จริงไว้ใน File Vault ด้วย</div></div><div class="card"><div class="panel-title"><div><div class="ey">QUICK SSR</div><h2>${g?esc(g.scientificName):'No sequence loaded'}</h2></div></div>${g?(quick.length?`<div class="table-wrap"><table style="min-width:650px"><thead><tr><th>Type</th><th>Motif</th><th>Repeats</th><th>Start</th><th>End</th></tr></thead><tbody>${quick.slice(0,300).map(x=>`<tr><td>${x.type}</td><td>${x.motif}</td><td>${x.count}</td><td>${x.start}</td><td>${x.end}</td></tr>`).join('')}</tbody></table></div>`:empty('≋','ไม่พบ SSR ตาม preset','ลอง genome อื่นหรือ preset อื่น')):empty('≋','ยังไม่มี sequence','Import GenBank ที่มี ORIGIN sequence ก่อน')}</div></div>`}
function irView(){const rows=state.genomes.filter(g=>g.lsc&&g.ssc&&g.ira&&g.irb);return `<div class="page-head"><div><div class="ey">IR EXPANSION / CONTRACTION</div><h1>▤ IR Border Comparison</h1><p>แสดง LSC–IRb–SSC–IRa และ junctions JLB / JSB / JSA / JLA เพื่อใช้ตรวจ expansion/contraction แบบ CPJSdraw/IRscope figures ในเปเปอร์.</p></div><button class="btn primary" onclick="app.open('ir')">＋ Boundary annotation</button></div><div class="card"><div class="ir-rows">${rows.length?rows.map(irRowHtml).join(''):empty('▤','ยังไม่มี region lengths','เพิ่ม LSC/SSC/IRa/IRb ใน genome record')}</div></div><div class="card" style="margin-top:14px"><div class="panel-title"><div><div class="ey">BOUNDARY GENE NOTES</div><h2>Junction annotations</h2></div></div>${state.irBorders.length?table(state.irBorders,[['genomeName','Genome'],['jlb','JLB'],['jsb','JSB'],['jsa','JSA'],['jla','JLA']], 'ir'):empty('⌁','ยังไม่มี boundary annotation','บันทึกยีนที่อยู่ติด/ข้าม junction เช่น rps19, ycf1, ndhF, trnH')}</div>`}

function scatterSvg(rows,xfn,yfn,xlab,ylab,ref=true){if(!rows.length)return empty('⌁','No data','Import CSV first');const pts=rows.map(r=>[xfn(r),yfn(r)]).filter(x=>x.every(Number.isFinite)),W=700,H=420,p=48,xmin=Math.min(0,...pts.map(x=>x[0])),xmax=Math.max(1,...pts.map(x=>x[0])),ymin=Math.min(0,...pts.map(x=>x[1])),ymax=Math.max(1,...pts.map(x=>x[1])),sx=x=>p+(x-xmin)/(xmax-xmin||1)*(W-p*1.4),sy=y=>H-p-(y-ymin)/(ymax-ymin||1)*(H-p*1.5);return `<svg viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><line x1="${p}" y1="${H-p}" x2="${W-15}" y2="${H-p}" stroke="#aab2ac"/><line x1="${p}" y1="15" x2="${p}" y2="${H-p}" stroke="#aab2ac"/>${ref?`<line x1="${sx(.5)}" y1="15" x2="${sx(.5)}" y2="${H-p}" stroke="#d7dcda" stroke-dasharray="4 4"/><line x1="${p}" y1="${sy(.5)}" x2="${W-15}" y2="${sy(.5)}" stroke="#d7dcda" stroke-dasharray="4 4"/>`:''}${pts.map(x=>`<circle cx="${sx(x[0])}" cy="${sy(x[1])}" r="3.2" fill="#607f70" fill-opacity=".75"/>`).join('')}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="11">${xlab}</text><text x="14" y="${H/2}" font-size="11" transform="rotate(-90 14 ${H/2})">${ylab}</text></svg>`}

function parseGenBank(text){
 const lines=text.split(/\r?\n/);
 const locus=lines.find(x=>x.startsWith('LOCUS'))||'';
 const acc=(lines.find(x=>x.startsWith('ACCESSION'))||'').trim().split(/\s+/)[1]||'';
 const definition=(lines.find(x=>x.startsWith('DEFINITION'))||'').replace('DEFINITION','').trim();
 const locusMatch=locus.match(/\s(\d+)\s+bp/i);
 const locusLength=locusMatch?+locusMatch[1]:0;
 let seq='', inOrigin=false, features=[], cur=null;
 for(const line of lines){
   if(line.startsWith('ORIGIN')){inOrigin=true;continue;}
   if(inOrigin){
     if(line.startsWith('//')){inOrigin=false;continue;}
     seq+=line.replace(/[^a-zA-Z]/g,'');
     continue;
   }
   const featureMatch=line.match(/^\s{5}(gene|CDS|tRNA|rRNA)\s+(.+)$/);
   if(featureMatch){
     if(cur)features.push(cur);
     const loc=featureMatch[2];
     const nums=[...loc.matchAll(/(\d+)/g)].map(x=>+x[1]);
     cur={type:featureMatch[1],start:nums.length?Math.min(...nums):0,end:nums.length?Math.max(...nums):0,strand:/complement/.test(loc)?-1:1,gene:''};
   }else if(cur){
     const gm=line.match(/\/gene="([^"]+)"/);
     const pm=line.match(/\/product="([^"]+)"/);
     if(gm)cur.gene=gm[1];
     else if(!cur.gene&&pm)cur.gene=pm[1].split(' ')[0];
   }
 }
 if(cur)features.push(cur);

 const mapSel=document.getElementById('mapGenomeSel');if(mapSel)mapSel.onchange=e=>{selectedGenome=e.target.value;render()};const em=document.getElementById('exportMap');if(em)em.onclick=exportSvg;document.querySelectorAll('.geneArc').forEach(el=>{el.onmousemove=e=>{const t=document.getElementById('tip');t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px';t.textContent=`${el.dataset.gene} · ${el.dataset.pos}`};el.onmouseleave=()=>document.getElementById('tip').style.display='none'});
 const gb=document.getElementById('gbInput');if(gb)gb.onchange=async e=>{for(const f of [...e.target.files]){try{const g=importGenBankText(await f.text(),f.name);await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'GenBank',genomeId:g.id})}catch(err){toast('อ่าน GenBank ไม่สำเร็จ: '+err.message)}}};

 const vi=document.getElementById('vaultInput');if(vi)vi.onchange=async e=>{for(const f of e.target.files)await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:inferKind(f.name)})};

 document.getElementById('clearGbPaste')?.addEventListener('click',()=>{document.getElementById('gbPaste').value=''});
 document.getElementById('importFastaPaste')?.addEventListener('click',()=>{try{importFastaText(document.getElementById('fastaPaste').value,'Pasted FASTA');render()}catch(e){toast(e.message)}});
 document.getElementById('sendFastaCompare')?.addEventListener('click',()=>{const raw=document.getElementById('fastaPaste')?.value||'';if(!parseFasta(raw).length)return toast('วาง FASTA ก่อน');state.lastAlignmentText=raw;state.active='compare';save();render()});
 const runAlignment=raw=>{try{state.settings.window=+document.getElementById('winInput')?.value||1000;state.settings.step=+document.getElementById('stepInput')?.value||500;state.settings.cutoff=+document.getElementById('cutoffInput')?.value||0;state.lastAlignmentText=raw;state.lastCompare=analyzeAlignment(raw,state.settings.window,state.settings.step,state.settings.cutoff,document.getElementById('refGenomeSel')?.value||'');activity('วิเคราะห์ alignment',`${state.lastCompare.taxa} taxa · ${state.lastCompare.length} bp`);save();render()}catch(err){toast(err.message)}};
 const ai=document.getElementById('alnInput');if(ai)ai.onchange=async e=>{const f=e.target.files[0];if(!f)return;const raw=await f.text();runAlignment(raw);await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Multiple alignment'})};
 document.getElementById('runPasteAlignment')?.addEventListener('click',()=>runAlignment(document.getElementById('alignmentPaste')?.value||''));
 document.getElementById('sendToPhylo')?.addEventListener('click',()=>{state.lastAlignmentText=document.getElementById('alignmentPaste')?.value||state.lastAlignmentText||'';state.phyloPreferGenomeFasta=false;state.active='phylogeny';save();render()});
 const ep=document.getElementById('exportPi');if(ep)ep.onclick=()=>{if(!state.lastCompare)return;download('nucleotide-diversity.csv','start,end,mid,pi\n'+state.lastCompare.windows.map(x=>[x.start,x.end,x.mid,x.pi].join(',')).join('\n'),'text/csv')};
 const ti=document.getElementById('treeInput');if(ti)ti.onchange=async e=>{const f=e.target.files[0];if(!f)return;const nw=(await f.text()).trim();state.trees.unshift({id:uid('TREE'),name:f.name,dataset:'Other',method:'Imported Newick',model:'',outgroup:'',support:'',software:'External analysis',newick:nw,createdAt:new Date().toISOString()});await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Newick'});activity('Import Newick',f.name);save();render()};
 const ts=document.getElementById('treeSel');if(ts){ts.onchange=()=>{const tr=state.trees.find(x=>x.id===ts.value);document.getElementById('treeCanvas').innerHTML=tr?treeSvg(tr.newick):empty('⑂','เลือก tree','')};if(ts.value){const tr=state.trees.find(x=>x.id===ts.value);if(tr)document.getElementById('treeCanvas').innerHTML=treeSvg(tr.newick)}}
 document.getElementById('buildNj')?.addEventListener('click',buildQuickNj);
 document.getElementById('useLastAlignment')?.addEventListener('click',()=>{const el=document.getElementById('phyloFasta');if(el)el.value=state.lastAlignmentText||''});
 document.getElementById('buildReference')?.addEventListener('click',fetchReferenceTree);
 document.getElementById('fillGenomeTaxa')?.addEventListener('click',()=>{const el=document.getElementById('referenceTaxa');if(el)el.value=[...new Set(state.genomes.map(g=>g.scientificName).filter(Boolean))].join('\n')});
 document.getElementById('saveNewickPaste')?.addEventListener('click',savePastedNewick);
 const ci=document.getElementById('codonInput');if(ci)ci.onchange=async e=>{const f=e.target.files[0];if(!f)return;state.codonRows=parseCsv(await f.text());await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Codon CSV'});activity('Import codon CSV',`${state.codonRows.length} genes`);save();render()};
 document.querySelectorAll('.hybrid-source').forEach(sel=>sel.onchange=()=>setHybridSource(sel.dataset.stage,sel.value));
 const sp=document.getElementById('setPreset');if(sp){document.getElementById('saveSettings').onclick=()=>{state.settings.preset=sp.value;state.settings.cutoff=+document.getElementById('setCutoff').value;state.settings.window=+document.getElementById('setWindow').value;state.settings.step=+document.getElementById('setStep').value;save();render();toast('บันทึกแล้ว')}}
 document.getElementById('backup2')?.addEventListener('click',backup);document.getElementById('restore2')?.addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('resetAll')?.addEventListener('click',()=>{if(confirm('ล้าง metadata ทั้งหมด?')){localStorage.removeItem(STORE);state=structuredClone(defaults);save();render()}})
}
