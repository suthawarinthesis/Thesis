.locker-toolbar{display:grid;grid-template-columns:minmax(220px,1.3fr) repeat(2,minmax(150px,.55fr)) auto;gap:8px;align-items:end;margin:12px 0}.locker-toolbar .field{margin:0}.species-locker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:11px}.species-locker-card{border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden;box-shadow:0 8px 24px rgba(29,39,33,.035)}.species-locker-head{padding:13px 14px 11px;background:linear-gradient(180deg,#fbfcfb,#f7f9f8);border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.species-locker-head h3{margin:2px 0 0;font-size:16px;line-height:1.25;letter-spacing:-.025em}.species-locker-head small{display:block;color:#7e8982;font-size:9.8px;margin-top:4px}.species-locker-body{display:grid}.locker-genome-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:9px;align-items:start;padding:10px 12px;border-top:1px solid #edf0ee}.locker-genome-row:first-child{border-top:0}.locker-genome-row input{margin-top:4px}.locker-genome-main{min-width:0}.locker-genome-main b{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.locker-genome-main small{display:block;color:#818b85;font-size:9px;line-height:1.45;margin-top:3px}.locker-genome-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.locker-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.locker-summary span{border:1px solid #e3e8e5;background:#fff;border-radius:999px;padding:5px 8px;font-size:9.5px;font-weight:800;color:#65716a}.locker-selection-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid #dce6e0;background:#f6faf7;border-radius:14px;margin:10px 0}.locker-selection-bar b{font-size:11px}.locker-selection-bar small{font-size:9.5px;color:#77827c;display:block;margin-top:2px}.phylo-genbank-panel{border:1px solid #dce5e0;background:lin /* ===== V5 · Scientific Workspace Redesign ===== */
:root{--v5-bg:#f3f5f7;--v5-panel:#ffffff;--v5-side:#16211c;--v5-side2:#213029;--v5-text:#1e2823;--v5-muted:#77837c;--v5-line:#e1e6e3;--v5-green:#587968;--v5-green-soft:#eaf2ed;--v5-blue:#607f95;--v5-blue-soft:#eaf1f5;--v5-purple:#746b8a;--v5-purple-soft:#f0edf5;--v5-amber:#9b7945;--v5-amber-soft:#f8f0e2;--v5-red:#985950;--v5-red-soft:#f8ecea;--v5-shadow:0 12px 34px rgba(24,35,29,.055)}

.side-brand b{display:block;font-size:16px;letter-spacing:-.02em}.side-brand small{display:block;color:#9fb1a7;font-size:10px;margin-top:2px}

.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.09);padding:14px 9px 4px;color:#8fa198;font-size:9.5px;line-height:1.6}.side-foot b{color:#dbe7e1}
.workspace{min-width:0}.topbar-v5{position:sticky;top:0;z-index:30;min-height:72px;background:rgba(243,245,247,.9);backdrop-filter:blur(15px);border-bottom:1px solid rgba(218,225,220,.9);padding:12px 22px;display:flex;align-items:center;gap:12px}.crumb{font-size:12px;font-weight:900;color:#26342d}.crumb small{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#8a958f;margin-bottom:2px}.top-search{flex:1;max-width:520px;margin-left:auto;position:relative}.top-search input{background:#fff;border:1px solid var(--v5-line);border-radius:13px;padding:10px 12px 10px 34px;font-size:11px;width:100%;outline:0}.top-search:before{content:'⌕';position:absolute;left:12px;top:9px;color:#87938c}.topbar-actions-v5{display:flex;gap:7px;align-items:center}.topbar-v5 .btn{padding:9px 11px}

   const src=paperPresets[h[stage]]||paperPresets.solanum;

 }

function mapView(){
 const gs=state.genomes;
 if(!gs.length)return `<div class="page-head"><div><div class="ey">OGDRAW-STYLE VIEW</div><h1>◎ Circular cp Genome Map</h1><p>ยีนด้านใน = clockwise; ยีนด้านนอก = counterclockwise พร้อม LSC, SSC, IRb, IRa และ GC track</p></div></div><div class="card">${empty('◎','ยังไม่มี genome','Import GenBank หรือเพิ่ม genome record ก่อน')}</div>`;
 if(!selectedGenome||!gs.some(x=>x.id===selectedGenome))selectedGenome=gs[0].id;
 const g=gs.find(x=>x.id===selectedGenome)||gs[0];
 const feats=Array.isArray(g.features)?g.features:[];
 return `<div class="page-head"><div><div class="ey">CIRCULAR PLASTOME</div><h1>◎ Circular cp Genome Map</h1><p>เลือก genome จาก Species Locker แล้วแสดง circular plastome แบบ publication-style: outside = counterclockwise, inside = clockwise พร้อม LSC–IRb–SSC–IRa และ GC track.</p></div><div class="actions"><select class="select" id="mapGenomeSel" style="min-width:260px">${gs.map(x=>`<option value="${x.id}" ${x.id===g.id?'selected':''}>${esc(x.scientificName)} ${esc(x.accession||'')}</option>`).join('')}</select><button class="btn ghost" id="exportMap">⇩ SVG</button></div></div>
 <div class="map-shell"><div class="card map-canvas" id="mapCanvas">${circularSvg(g)}</div><div class="card"><div class="panel-title"><div><div class="ey">GENOME FEATURES</div><h2><i>${esc(g.scientificName||'Unknown species')}</i></h2><div class="row-sub">${esc(g.accession||g.id||'')}</div></div></div>
 <div class="mini-grid" style="grid-template-columns:1fr 1fr"><div class="mini"><b>${fmt(g.length)}</b><span>Total bp</span></div><div class="mini"><b>${esc(g.gc||'—')}</b><span>GC %</span></div><div class="mini"><b>${fmt(g.lsc)}</b><span>LSC</span></div><div class="mini"><b>${fmt(g.ssc)}</b><span>SSC</span></div><div class="mini"><b>${fmt(g.irb)}</b><span>IRb</span></div><div class="mini"><b>${fmt(g.ira)}</b><span>IRa</span></div></div>
 <div class="legend" style="margin-top:14px">${Object.entries(geneColors).map(([k,c])=>`<div class="legend-item"><span class="sw" style="background:${c}"></span><span>${esc(k)}</span></div>`).join('')}</div>
 <div class="notice" style="margin-top:14px">${feats.length?`พบ ${fmt(feats.length)} annotated features จาก GenBank. เลื่อนเมาส์บน gene arc เพื่อดูชื่อและตำแหน่ง.`:'Genome นี้ยังไม่มี feature annotation; ถ้าเป็น FASTA อย่างเดียวจะแสดงโครงสร้าง region/GC ได้ แต่ยังไม่มี gene arcs.'}</div></div></div>`;
}
const geneColors={'Photosystem I':'#4f7d62','Photosystem II':'#5a9465','ATP synthase':'#b7a64e','NADH dehydrogenase':'#7b9660','Cytochrome b6/f':'#bb745c','Rubisco':'#495e9d','Ribosomal protein':'#c4955f','RNA polymerase':'#8d627d','tRNA':'#6f9ca8','rRNA':'#b75858','ycf/other':'#8d8f88'};
function geneGroup(name,type=''){const n=String(name||'');if(/^psa/i.test(n))return 'Photosystem I';if(/^psb/i.test(n))return 'Photosystem II';if(/^atp/i.test(n))return 'ATP synthase';if(/^ndh/i.test(n))return 'NADH dehydrogenase';if(/^pet/i.test(n))return 'Cytochrome b6/f';if(/^rbcL/i.test(n))return 'Rubisco';if(/^(rpl|rps)/i.test(n))return 'Ribosomal protein';if(/^rpo/i.test(n))return 'RNA polymerase';if(/^trn/i.test(n)||type==='tRNA')return 'tRNA';if(/^rrn/i.test(n)||type==='rRNA')return 'rRNA';return 'ycf/other'}
function polar(cx,cy,r,a){const t=(a-90)*Math.PI/180;return [cx+r*Math.cos(t),cy+r*Math.sin(t)]}
function arcPath(cx,cy,r,a0,a1){const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),delta=((a1-a0)%360+360)%360,large=delta>180?1:0;return `M ${p0[0]} ${p0[1]} A ${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]}`}
function circularSvg(g){const W=760,H=700,cx=380,cy=350,R=238,len=Number(g.length)||Number(g.lsc)+Number(g.irb)+Number(g.ssc)+Number(g.ira)||150000,scale=360/len;let feats=Array.isArray(g.features)?g.features:[];let regions=[['LSC',+g.lsc||len*.55],['IRb',+g.irb||len*.16],['SSC',+g.ssc||len*.12],['IRa',+g.ira||len*.17]],sum=regions.reduce((a,x)=>a+x[1],0);if(Math.abs(sum-len)>10){const f=len/sum;regions=regions.map(x=>[x[0],x[1]*f])}let pos=0,regionSvg='';const regColor={LSC:'#dce9e1',IRb:'#ecd9ae',SSC:'#dbe9f1',IRa:'#ecd9ae'};for(const [n,l] of regions){const a0=pos*scale,a1=(pos+l)*scale;regionSvg+=`<path d="${arcPath(cx,cy,R-46,a0,a1)}" fill="none" stroke="${regColor[n]}" stroke-width="16"/><text x="${polar(cx,cy,R-46,(a0+a1)/2)[0]}" y="${polar(cx,cy,R-46,(a0+a1)/2)[1]}" font-size="10" font-weight="800" text-anchor="middle" dominant-baseline="middle">${n}</text>`;pos+=l}let geneSvg='';for(const f of feats.slice(0,500)){if(!f.start||!f.end)continue;const mid=((f.start+f.end)/2)*scale,a0=f.start*scale,a1=f.end*scale,inner=f.strand!==-1,r=inner?R-12:R+12,sw=14,col=geneColors[geneGroup(f.gene,f.type)]||'#999';geneSvg+=`<path d="${arcPath(cx,cy,r,a0,a1)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="butt" data-gene="${esc(f.gene||f.type)}" data-pos="${f.start}-${f.end}" class="geneArc"/>`;if((f.end-f.start)>900){const p=polar(cx,cy,inner?R-28:R+31,mid),rot=mid;geneSvg+=`<text x="${p[0]}" y="${p[1]}" font-size="7" text-anchor="middle" transform="rotate(${rot} ${p[0]} ${p[1]})">${esc(f.gene||'')}</text>`}}let gc='';if(g.sequence){const step=Math.max(100,Math.floor(g.sequence.length/240));for(let i=0;i<g.sequence.length;i+=step){const s=g.sequence.slice(i,i+step),v=(s.match(/[GC]/gi)||[]).length/Math.max(1,(s.match(/[ATGC]/gi)||[]).length),r0=R-78,r1=r0+(v-.2)*45,a=i*scale;const p0=polar(cx,cy,r0,a),p1=polar(cx,cy,r1,a);gc+=`<line x1="${p0[0]}" y1="${p0[1]}" x2="${p1[0]}" y2="${p1[1]}" stroke="#9ea7a1" stroke-width="1"/>`}}return `<svg id="cpSvg" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#d9dfda"/><circle cx="${cx}" cy="${cy}" r="${R-62}" fill="none" stroke="#e2e6e2"/>${gc}${regionSvg}${geneSvg}<text x="${cx}" y="${cy-12}" text-anchor="middle" font-size="20" font-weight="800" font-style="italic">${esc(g.scientificName||'Chloroplast genome')}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#68736b">chloroplast genome</text><text x="${cx}" y="${cy+34}" text-anchor="middle" font-size="12" font-weight="700">${fmt(len)} bp</text><text x="${cx}" y="${cy+56}" text-anchor="middle" font-size="9" fill="#8a938d">inside genes: clockwise · outside genes: counterclockwise</text></svg>`}
function compareView(){const p=currentPreset();return `<div class="page-head"><div><div class="ey">ALIGNMENT → DIVERSITY</div><h1>⇄ Compare Genome & Hotspot</h1><p>รับ multiple FASTA alignment ทั้งแบบอัปโหลดไฟล์หรือวางโค้ด เพื่อสรุป variable sites, parsimony-informative sites, pairwise p-distance/K2P และ nucleotide diversity (Pi) แบบ sliding window พร้อม hotspot annotation จาก reference GenBank.</p></div><div class="actions"><button class="btn primary" onclick="document.getElementById('alnInput').click()">⇧ Import alignment FASTA</button></div></div><input class="hidden" id="alnInput" type="file" accept=".fa,.fasta,.fas,.aln,.txt">

function compareSummaryHtml(r){return `<div class="mini-grid"><div class="mini"><b>${fmt(r.taxa)}</b><span>Taxa</span></div><div class="mini"><b>${fmt(r.length)}</b><span>Alignment bp</span></div><div class="mini"><b>${fmt(r.variable)}</b><span>Variable sites</span></div><div class="mini"><b>${fmt(r.parsimony)}</b><span>Parsimony informative</span></div></div>${r.distances?.length?`<div class="table-wrap" style="margin-top:10px"><table style="min-width:600px"><thead><tr><th>Pair</th><th>p-distance</th><th>K2P</th></tr></thead><tbody>${r.distances.slice(0,30).map(x=>`<tr><td>${esc(x.a)} ↔ ${esc(x.b)}</td><td>${x.p.toFixed(6)}</td><td>${Number.isFinite(x.k2p)?x.k2p.toFixed(6):'NA'}</td></tr>`).join('')}</tbody></table></div>`:''}`}
function hotspotHtml(h){if(!h.length)return empty('⌁','ไม่พบ hotspot เหนือ cutoff','ปรับ cutoff หรือใช้ alignment อื่น');return `<div class="hotspot-list">${h.map(x=>`<div class="hotspot"><div><b>${fmt(x.start)}–${fmt(x.end)} bp ${x.annotation?'· '+esc(x.annotation):''}</b><span>midpoint ${fmt(x.mid)}</span></div><b>Pi ${x.pi.toFixed(5)}</b></div>`).join('')}</div>`}
function piChartSvg(rows,cut){if(!rows.length)return '';const W=1000,H=330,pad=45,maxX=Math.max(...rows.map(x=>x.mid)),maxY=Math.max(cut*1.2,...rows.map(x=>x.pi),.0001),sx=x=>pad+(x/maxX)*(W-pad*1.4),sy=y=>H-pad-(y/maxY)*(H-pad*1.5),pts=rows.map(x=>`${sx(x.mid)},${sy(x.pi)}`).join(' ');return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><line x1="${pad}" y1="${H-pad}" x2="${W-18}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="18" x2="${pad}" y2="${H-pad}" stroke="#aab2ac"/><line x1="${pad}" y1="${sy(cut)}" x2="${W-18}" y2="${sy(cut)}" stroke="#a35b53" stroke-dasharray="5 5"/><text x="${W-22}" y="${sy(cut)-5}" font-size="10" text-anchor="end" fill="#9a554e">cutoff ${cut}</text><polyline points="${pts}" fill="none" stroke="#607f70" stroke-width="2"/>${rows.filter(x=>x.pi>=cut).map(x=>`<circle cx="${sx(x.mid)}" cy="${sy(x.pi)}" r="3.5" fill="#a35b53"/>`).join('')}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="11">Position (bp)</text><text x="14" y="${H/2}" font-size="11" transform="rotate(-90 14 ${H/2})">Nucleotide diversity (Pi)</text></svg>`}
function repeatView(){const p=currentPreset(),g=state.genomes.find(x=>x.sequence)||null;const quick=g?findSSRs(g.sequence,state.settings.preset==='hybrid'?(state.settings.hybridSources?.repeats||'ipomoea'):state.settings.preset):[];return `<div class="page-head"><div><div class="ey">REPEAT ANALYSIS</div><h1>≋ SSR / Large / Tandem Repeats</h1><p>ระบบมี quick SSR scan ใน browser และมีที่เก็บผล REPuter / Tandem Repeat Finder เพื่อให้ workflow สอดคล้องกับเปเปอร์โดยไม่อ้างว่าหน้าเว็บแทนเครื่องมือเฉพาะทางทั้งหมด.</p></div></div><div class="split"><div class="card"><div class="panel-title"><div><div class="ey">CURRENT PRESET</div><h2>${esc(p.short)}</h2></div></div><div class="preset"><h3>MISA-style thresholds</h3><p>${esc(p.ssr)}</p><h3>Large repeats</h3><p>${esc(p.large||'')}</p>${p.tandem?`<h3>Tandem repeats</h3><p>${esc(p.tandem)}</p>`:''}</div><div class="notice">Quick SSR จะใช้ sequence จาก GenBank ที่ import เข้ามา และรายงาน motif/position/count. สำหรับ publication-grade results แนะนำเก็บผล MISA/REPuter/TRF จริงไว้ใน File Vault ด้วย</div></div><div class="card"><div class="panel-title"><div><div class="ey">QUICK SSR</div><h2>${g?esc(g.scientificName):'No sequence loaded'}</h2></div></div>${g?(quick.length?`<div class="table-wrap"><table style="min-width:650px"><thead><tr><th>Type</th><th>Motif</th><th>Repeats</th><th>Start</th><th>End</th></tr></thead><tbody>${quick.slice(0,300).map(x=>`<tr><td>${x.type}</td><td>${x.motif}</td><td>${x.count}</td><td>${x.start}</td><td>${x.end}</td></tr>`).join('')}</tbody></table></div>`:empty('≋','ไม่พบ SSR ตาม preset','ลอง genome อื่นหรือ preset อื่น')):empty('≋','ยังไม่มี sequence','Import GenBank ที่มี ORIGIN sequence ก่อน')}</div></div>`}

function scatterSvg(rows,xfn,yfn,xlab,ylab,ref=true){if(!rows.length)return empty('⌁','No data','Import CSV first');const pts=rows.map(r=>[xfn(r),yfn(r)]).filter(x=>x.every(Number.isFinite)),W=700,H=420,p=48,xmin=Math.min(0,...pts.map(x=>x[0])),xmax=Math.max(1,...pts.map(x=>x[0])),ymin=Math.min(0,...pts.map(x=>x[1])),ymax=Math.max(1,...pts.map(x=>x[1])),sx=x=>p+(x-xmin)/(xmax-xmin||1)*(W-p*1.4),sy=y=>H-p-(y-ymin)/(ymax-ymin||1)*(H-p*1.5);return `<svg viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><line x1="${p}" y1="${H-p}" x2="${W-15}" y2="${H-p}" stroke="#aab2ac"/><line x1="${p}" y1="15" x2="${p}" y2="${H-p}" stroke="#aab2ac"/>${ref?`<line x1="${sx(.5)}" y1="15" x2="${sx(.5)}" y2="${H-p}" stroke="#d7dcda" stroke-dasharray="4 4"/><line x1="${p}" y1="${sy(.5)}" x2="${W-15}" y2="${sy(.5)}" stroke="#d7dcda" stroke-dasharray="4 4"/>`:''}${pts.map(x=>`<circle cx="${sx(x[0])}" cy="${sy(x[1])}" r="3.2" fill="#607f70" fill-opacity=".75"/>`).join('')}<text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="11">${xlab}</text><text x="14" y="${H/2}" font-size="11" transform="rotate(-90 14 ${H/2})">${ylab}</text></svg>`}

function parseGenBank(text){
 const lines=text.split(/\r?\n/);
 const locus=lines.find(x=>x.startsWith('LOCUS'))||'';
 const acc=(lines.find(x=>x.startsWith('ACCESSION'))||'').trim().split(/\s+/)[1]||'';
 const definition=(lines.find(x=>x.startsWith('DEFINITION'))||'').replace('DEFINITION','').trim();
 const locusMatch=locus.match(/\s(\d+)\s+bp/i);
 const locusLength=locusMatch?+locusMatch[1]:0;
 let seq='', inOrigin=false, features=[], cur=null;

function buildPhyloDataset(){let ids=[...document.querySelectorAll('.dsGenome:checked')].map(x=>x.value),rows=state.genomes.filter(g=>ids.includes(g.id)&&g.sequence),type=document.getElementById('dsType')?.value||'whole',gene=String(document.getElementById('dsGene')?.value||'').trim(),markerId=document.getElementById('dsMarker')?.value||'',name=String(document.getElementById('dsName')?.value||'').trim();let fasta='',genes=[],notes='';if(type==='marker'){const m=state.markers.find(x=>x.id===markerId);if(!m?.fasta)return toast('เลือก saved hotspot marker');fasta=m.fasta;notes=`Marker ${m.label}`;if(!name)name=m.label;}else{if(rows.length<2)return toast('เลือก genome ที่มี sequence อย่างน้อย 2 records');if(type==='whole')fasta=genomesToFasta(rows);else if(type==='noira'){fasta=rows.map(g=>{let n=+g.ira||0,s=n&&g.sequence.length>n?g.sequence.slice(0,g.sequence.length-n):g.sequence;return `>${nwLabel(g.scientificName)}|${g.accession||g.id}\n${s}`}).join('\n');notes='IRa removed assuming sequence order LSC→IRb→SSC→IRa';}else if(type==='gene'){if(!gene)return toast('ใส่ชื่อ gene');const rec=[];rows.forEach(g=>{const f=(g.features||[]).find(x=>String(x.gene||'').toLowerCase()===gene.toLowerCase());if(f)rec.push(`>${nwLabel(g.scientificName)}|${g.accession||g.id}|${gene}\n${featureSeq(g,f)}`)});if(rec.length<2)return toast('พบ gene ใน genome น้อยกว่า 2 records');fasta=rec.join('\n');notes=`Named gene: ${gene}`;}else if(type==='sharedcds'){genes=sharedCdsGenes(rows);if(!genes.length)return toast('ไม่พบ shared CDS');fasta=rows.map(g=>{let seq='';genes.forEach(gn=>{const f=(g.features||[]).find(x=>x.type==='CDS'&&String(x.gene||'').toLowerCase()===gn);if(f)seq+=featureSeq(g,f)});return `>${nwLabel(g.scientificName)}|${g.accession||g.id}|shared_CDS_${genes.length}\n${seq}`}).join('\n');notes=`Concatenated ${genes.length} shared unique CDS`;}}const st=datasetStats(fasta),id=uid('DS'),ds={id,name:name||`${type} · ${st.taxa} taxa · ${new Date().toLocaleDateString('en-CA')}`,type,ge function wallaceTm(seq){seq=String(seq||'').toUpperCase();const at=(seq.match(/[AT]/g)||[]).length,gc=(seq.match(/[GC]/g)||[]).length;return 2*at+4*gc}
function markerPrimer(marker){const g=state.genomes.find(x=>x.sequence&&x.features?.length)||state.genomes.find(x=>x.sequence);if(!g?.sequence)return null;let s=Math.max(1,+marker.start||1),e=Math.min(g.sequence.length,+marker.end||s+200),fStart=Math.max(0,s-1-60),f=g.sequence.slice(fStart,fStart+20),rRaw=g.sequence.slice(Math.min(g.sequence.length-20,e+20),Math.min(g.sequence.length,e+40));if(f.length<18||rRaw.length<18)return null;const r=reverseComplement(rRaw.slice(-20));return{forward:f,reverse:r,tmF:wallaceTm(f),tmR:wallaceTm(r),product:Math.max(0,(e+40)-(fStart))}}

function junctionContext(g,pos){const feats=(g.features||[]).filter(f=>f.start&&f.end),over=feats.filter(f=>pos>=f.start&&pos<=f.end).sort((a,b)=>(a.end-a.start)-(b.end-b.start))[0];if(over)return `${over.gene||over.type} crosses`;let left=null,right=null;for(const f of feats){if(f.end<pos&&(!left||f.end>left.end))left=f;if(f.start>pos&&(!right||f.start<right.start))right=f}const l=left?`${left.gene||left.type} ${pos-left.end} bp`:'—',r=right?`${right.gene||right.type} ${right.start-pos} bp`:'—';return `${l} | ${r}`}

function irStudioSvg(rows){if(!rows.length)return'';const W=1200,rowH=92,H=45+rows.length*rowH,max=Math.max(...rows.map(g=>(+g.lsc||0)+(+g.irb||0)+(+g.ssc||0)+(+g.ira||0))),x0=190,w=950,cols={LSC:'#dfeae4',IRb:'#efdcb7',SSC:'#dceaf2',IRa:'#efdcb7'};let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/>`;rows.forEach((g,i)=>{const y=30+i*rowH,total=(+g.lsc||0)+(+g.irb||0)+(+g.ssc||0)+(+g.ira||0),scale=w/Math.max(1,max),parts=[['LSC',+g.lsc||0],['IRb',+g.irb||0],['SSC',+g.ssc||0],['IRa',+g.ira||0]];s+=`<text x="12" y="${y+22}" font-size="12" font-style="italic" font-weight="700">${esc(g.scientificName)}</text><text x="12" y="${y+38}" font-size="9" fill="#7a857f">${esc(g.accession||'')} · ${fmt(total)} bp</text>`;let x=x0;parts.forEach(([n,len])=>{const ww=len*scale;s+=`<rect x="${x}" y="${y}" width="${ww}" height="24" rx="4" fill="${cols[n]}"/><text x="${x+ww/2}" y="${y+16}" font-size="9" text-anchor="middle">${n}</text>`;x+=ww});const j=irJunctions(g),ps=[['JLB',+g.lsc||0],['JSB',(+g.lsc||0)+(+g.irb||0)],['JSA',(+g.lsc||0)+(+g.irb||0)+(+g.ssc||0)],['JLA',total]];ps.forEach(([n,p],k)=>{let xx=x0+p*scale;s+=`<line x1="${xx}" y1="${y-3}" x2="${xx}" y2="${y+31}" stroke="#59675f" stroke-width="1"/><text x="${xx}" y="${y+44}" font-size="8" text-anchor="middle" font-weight="700">${n}</text><text x="${xx}" y="${y+57+k%2*11}" font-size="7" text-anchor="middle" fill="#68756e">${esc(j[n].text)}</text>`})});return s+'</svg>'}

function qcSummaryFigureSvg(){const rows=state.genomes.slice(0,30).map(g=>({g,q:state.qcResults[g.id]||qcGenome(g)}));const W=1000,H=Math.max(260,70+rows.length*28),x0=260,w=650;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><rect width="100%" height="100%" fill="white"/><text x="30" y="35" font-size="20" font-weight="700">cp Genome QC summary</text>`;rows.forEach((x,i)=>{const y=60+i*28,ww=w*x.q.score/100;s+=`<text x="30" y="${y+12}" font-size="10" font-style="italic">${esc(x.g.scientificName)}</text><rect x="${x0}" y="${y}" width="${w}" height="14" rx="7" fill="#edf1ef"/><rect x="${x0}" y="${y}" width="${ww}" height="14" rx="7" fill="#607f70"/><text x="${x0+w+10}" y="${y+11}" font-size="9">${x.q.score}%</text>`});return s+'</svg>'}

function normalizeAccession(v){return String(v||'').trim().toUpperCase().replace(/^>/,'').replace(/\.\d+$/,'')}
function canonicalTaxon(v){return String(v||'').replace(/_/g,' ').replace(/\s+/g,' ').replace(/\s+(chloroplast|plastid).*$/i,'').trim().toLowerCase()}

async function fetchNcbiGenBank(){const input=document.getElementById('ncbiAccession'),status=document.getElementById('ncbiStatus'),acc=String(input?.value||'').trim();if(!acc)return toast('กรอก GenBank accession ก่อน');if(status)status.textContent='กำลังดึงข้อมูลจาก NCBI…';try{const url='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=nuccore&id='+encodeURIComponent(acc)+'&rettype=gbwithparts&retmode=text',r=await fetch(url,{headers:{'Accept':'text/plain'}});if(!r.ok)throw Error('NCBI HTTP '+r.status);const raw=await r.text(),before=state.genomes.length,g=importGenBankText(raw,'NCBI '+acc,true),rec=Array.isArray(g)?g[0]:g;await autoAssignFamilies(false,[rec.id],true);state.lastImportReport={at:new Date().toISOString(),files:0,added:state.genomes.length>before?1:0,merged:state.genomes.length===before?1:0,failed:0,records:1,familyResolved:rec.family?1:0,ids:[rec.id]};activity('Fetch / merge GenBank',`${rec.scientificName} · ${rec.accession||acc}`);save();render();if(status)status.innerHTML=`<b>สำเร็จ:</b> ${esc(rec.scientificName)} · ${esc(rec.accession||acc)} · ${fmt(rec.length)} bp`}catch(e){if(status)status.innerHTML=`<b>ดึงไม่สำเร็จ:</b> ${esc(e.message)}`;toast('NCBI fetch ไม่สำเร็จ')}}
function wireView(){const mapSel=document.getElementById('mapGenomeSel');if(mapSel)mapSel.onchange=e=>{selectedGenome=e.target.value;render()};const em=document.getElementById('exportMap');if(em)em.onclick=exportSvg;document.querySelectorAll('.geneArc').forEach(el=>{el.onmousemove=e=>{const t=document.getElementById('tip');t.style.display='block';t.style.left=e.clientX+12+'px';t.style.top=e.clientY+12+'px';t.textContent=`${el.dataset.gene} · ${el.dataset.pos}`};el.onmouseleave=()=>document.getElementById('tip').style.display='none'});const gb=document.getElementById('gbInput');if(gb)gb.onchange=e=>batchImportGenomeFiles(e.target.files,'GenBank');const fi=document.getElementById('fastaInput');if(fi)fi.onchange=e=>batchImportGenomeFiles(e.target.files,'FASTA');const mix=document.getElementById('mixedGenomeInput');if(mix)mix.onchange=e=>batchImportGenomeFiles(e.target.files,'auto');const vi=document.getElementById('vaultInput');if(vi)vi.onchange=async e=>{for(const f of e.target.files)await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:inferKind(f.name)})};document.getElementById('fetchNcbi')?.addEventListener('click',fetchNcbiGenBank);document.getElementById('importGbPaste')?.addEventListener('click',async()=>{try{const before=state.genomes.length,r=importGenBankText(document.getElementById('gbPaste').value,'Pasted GenBank',true),rows=Array.isArray(r)?r:[r];await autoAssignFamilies(false,rows.map(x=>x.id),true);state.lastImportReport={at:new Date().toISOString(),files:0,added:Math.max(0,state.genomes.length-before),merged:rows.length-Math.max(0,state.genomes.length-before),failed:0,records:rows.length,familyResolved:rows.filter(x=>x.family).length,ids:rows.map(x=>x.id)};activity('Paste GenBank',`${rows.length} record(s)`);save();render()}catch(e){toast(e.message)}});document.getElementById('clearGbPaste')?.addEventListener('click',()=>{document.getElementById('gbPaste').value=''});document.getElementById('importFastaPaste')?.addEventListener('click',async()=>{try{const before=state.genomes.length,rows=importFastaText(document.getElementById('fastaPaste').value,'Pasted FASTA',true);await autoAssignFamilies(false,rows.map(x=>x.id),true);const added=Math.max(0,state.genomes.length-before);state.lastImportReport={at:new Date().toISOString(),files:0,added,merged:rows.length-added,failed:0,records:rows.length,familyResolved:rows.filter(x=>x.family).length,ids:rows.map(x=>x.id)};activity('Paste FASTA',`${rows.length} sequence(s)`);save();render()}catch(e){toast(e.message)}});document.getElementById('sendFastaCompare')?.addEventListener('click',()=>{const raw=document.getElementById('fastaPaste')?.value||'';if(!parseFasta(raw).length)return toast('วาง FASTA ก่อน');state.lastAlignmentText=raw;state.active='compare';save();render()});const runAlignment=raw=>{try{state.settings.window=+document.getElementById('winInput')?.value||1000;state.settings.step=+document.getElementById('stepInput')?.value||500;state.settings.cutoff=+document.getElementById('cutoffInput')?.value||0;state.lastAlignmentText=raw;state.lastCompare=analyzeAlignment(raw,state.settings.window,state.settings.step,state.settings.cutoff,document.getElementById('refGenomeSel')?.value||'');activity('วิเคราะห์ alignment',`${state.lastCompare.taxa} taxa · ${state.lastCompare.length} bp`);save();render()}catch(err){toast(err.message)}};const ai=document.getElementById('alnInput');if(ai)ai.onchange=async e=>{const f=e.target.files[0];if(!f)return;const raw=await f.text();runAlignment(raw);await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Multiple alignment'})};document.getElementById('runPasteAlignment')?.addEventListener('click',()=>runAlignment(document.getElementById('alignmentPaste')?.value||''));document.getElementById('sendToPhylo')?.addEventListener('click',()=>{state.lastAlignmentText=document.getElementById('alignmentPaste')?.value||state.lastAlignmentText||'';state.phyloPreferGenomeFasta=false;state.active='phylogeny';save();render()});const ep=document.getElementById('exportPi');if(ep)ep.onclick=()=>{if(!state.lastCompare)return;download('nucleotide-diversity.csv','start,end,mid,pi\n'+state.lastCompare.windows.map(x=>[x.start,x.end,x.mid,x.pi].join(',')).join('\n'),'text/csv')};const ti=document.getElementById('treeInput');if(ti)ti.onchange=async e=>{const f=e.target.files[0];if(!f)return;const nw=(await f.text()).trim();state.trees.unshift({id:uid('TREE'),name:f.name,dataset:'Other',method:'Imported Newick',model:'',outgroup:'',support:'',software:'External analysis',newick:nw,createdAt:new Date().toISOString()});await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Newick'});activity('Import Newick',f.name);save();render()};const ts=document.getElementById('treeSel');if(ts){ts.onchange=()=>{const tr=state.trees.find(x=>x.id===ts.value);document.getElementById('treeCanvas').innerHTML=tr?treeSvg(tr.newick):empty('⑂','เลือก tree','')};if(ts.value){const tr=state.trees.find(x=>x.id===ts.value);if(tr)document.getElementById('treeCanvas').innerHTML=treeSvg(tr.newick)}}document.getElementById('buildNj')?.addEventListener('click',buildQuickNj);document.getElementById('useLastAlignment')?.addEventListener('click',()=>{const el=document.getElementById('phyloFasta');if(el)el.value=state.lastAlignmentText||''});document.getElementById('buildReference')?.addEventListener('click',fetchReferenceTree);document.getElementById('fillGenomeTaxa')?.addEventListener('click',()=>{const el=document.getElementById('referenceTaxa');if(el)el.value=[...new Set(state.genomes.map(g=>g.scientificName).filter(Boolean))].join('\n')});document.getElementById('saveNewickPaste')?.addEventListener('click',savePastedNewick);const ci=document.getElementById('codonInput');if(ci)ci.onchange=async e=>{const f=e.target.files[0];if(!f)return;state.codonRows=parseCsv(await f.text());await storeFile(f,{id:uid('FILE'),name:f.name,size:f.size,type:f.type,kind:'Codon CSV'});activity('Import codon CSV',`${state.codonRows.length} genes`);save();render()};document.querySelectorAll('.hybrid-source').forEach(sel=>sel.onchange=()=>setHybridSource(sel.dataset.stage,sel.value));const sp=document.getElementById('setPreset');if(sp){document.getElementById('saveSettings').onclick=()=>{state.settings.preset=sp.value;state.settings.cutoff=+document.getElementById('setCutoff').value;state.settings.window=+document.getElementById('setWindow').value;state.settings.step=+document.getElementById('setStep').value;save();render();toast('บันทึกแล้ว')}}document.getElementById('backup2')?.addEventListener('click',backup);document.getElementById('restore2')?.addEventListener('click',()=>document.getElementById('restoreFile').click());document.getElementById('resetAll')?.addEventListener('click',()=>{if(confirm('ล้าง metadata ทั้งหมด?')){localStorage.removeItem(STORE);state=structuredClone(defaults);save();render()}})}
